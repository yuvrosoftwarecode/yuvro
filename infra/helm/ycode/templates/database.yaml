{{- if .Values.components.database.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ycode-postgres-pvc
  namespace: {{ .Values.namespace }}
  labels:
    app: ycode
    component: database
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.components.database.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ycode-db
  namespace: {{ .Values.namespace }}
  labels:
    app: ycode
    component: database
spec:
  replicas: {{ .Values.components.database.replicas }}
  selector:
    matchLabels:
      app: ycode
      component: database
  template:
    metadata:
      labels:
        app: ycode
        component: database
    spec:
      containers:
        - name: postgres
          image: postgres:15
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "ycode_backend_db"
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ycode-backend-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: "/var/lib/postgresql/data/pgdata"
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U postgres
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U postgres
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources.database | nindent 12 }}
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: ycode-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: yuvro-postgresql-ycode
  namespace: {{ .Values.namespace }}
  labels:
    app: ycode
    component: database
spec:
  selector:
    app: ycode
    component: database
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  type: ClusterIP
{{- end }}
