# YHub Helm Chart Values - Production Environment

# Image configuration (pulls from GHCR registry in prod)
image:
  pullPolicy: IfNotPresent
  tag: "latest"

# Environment variables from .env.prod
env:
  DEPLOY_ENV: "prod"
  DEPLOY_TYPE: "kubernetes"
  DEBUG: "False"
  APP_NAME: "yhub"
  
  # Hosts & CORS
  ALLOWED_HOSTS: "api.yhub.yuvro.ai,yhub.yuvro.ai"
  CORS_ALLOWED_ORIGINS: "https://yhub.yuvro.ai"
  CSRF_TRUSTED_ORIGINS: "https://yhub.yuvro.ai"
  
  # JWT Settings
  JWT_ACCESS_TOKEN_LIFETIME: "15"
  JWT_REFRESH_TOKEN_LIFETIME: "7"
  
  # Database (uses AWS RDS)
  DATABASE_URL: "postgresql://yhub_prod_user:${DB_PASSWORD}@yhub-rds-prod.c123456.ap-south-1.rds.amazonaws.com:5432/yhub_prod_db"
  POSTGRES_DB: "yhub_prod_db"
  POSTGRES_USER: "yhub_prod_user"
  
  # Storage (AWS S3)
  STORAGE_BACKEND: "s3"
  AWS_STORAGE_BUCKET_NAME: "yuvro-prod"
  AWS_S3_REGION_NAME: "ap-south-1"
  AWS_S3_ENDPOINT_URL: ""
  AWS_S3_ADDRESSING_STYLE: "virtual"
  AWS_QUERYSTRING_AUTH: "False"
  
  # Frontend URL
  FRONTEND_URL: "https://yhub.yuvro.ai"
  
  # Product backends (production URLs)
  YCODE_BACKEND_URL: "https://api.ycode.yuvro.ai"
  YLABS_BACKEND_URL: "https://api.ylabs.yuvro.ai"
  
  # Email Configuration
  EMAIL_BACKEND: "django.core.mail.backends.smtp.EmailBackend"
  EMAIL_HOST: "smtp.hostinger.com"
  EMAIL_PORT: "465"
  EMAIL_USE_TLS: "False"
  EMAIL_USE_SSL: "True"
  DEFAULT_FROM_EMAIL: "contact@yuvro.ai"
  
  # Security
  SECURE_SSL_REDIRECT: "1"
  SECURE_HSTS_SECONDS: "31536000"
  SECURE_HSTS_INCLUDE_SUBDOMAINS: "1"
  SECURE_HSTS_PRELOAD: "1"
  
  # Frontend
  VITE_API_URL: "https://api.yhub.yuvro.ai"
  
  # LLM Configuration
  LLM_ENABLED: "true"
  LLM_TIMEOUT_SECONDS: "20"

# Secrets from .env.prod-secrets
secrets:
  SECRET_KEY: "prod-yhub-shared-jwt-secret-replace-with-strong-key-12345678901234"
  DB_PASSWORD: "ReplaceWithStrongRDSPassword123!@#"
  AWS_ACCESS_KEY_ID: "AKIA4Y6XDEPSPRODKEY4"
  AWS_SECRET_ACCESS_KEY: "ReplaceWithActualAWSSecretAccessKey/ForProduction+YuvroHub"
  GOOGLE_OAUTH2_CLIENT_ID: "ReplaceWithProdGoogleClientId.apps.googleusercontent.com"
  GOOGLE_OAUTH2_CLIENT_SECRET: "ReplaceWithProdGoogleClientSecret"
  GITHUB_CLIENT_ID: "ReplaceWithProdGitHubClientId"
  GITHUB_CLIENT_SECRET: "ReplaceWithProdGitHubClientSecret"
  OPENAI_API_KEY: "sk-ReplaceWithProductionOpenAIKey"
  ANTHROPIC_API_KEY: "sk-ant-ReplaceWithProductionAnthropicKey"
  GEMINI_API_KEY: "AIzaSyReplaceWithProductionGeminiKey"
  DEEPSEEK_API_KEY: "sk-ReplaceWithProductionDeepSeekKey"
  COHERE_API_KEY: "ReplaceWithProductionCohereKey"
  HUGGINGFACE_API_KEY: "hf_ReplaceWithProductionHuggingFaceKey"
  STRIPE_API_KEY: "sk_live_ReplaceWithProductionStripeKey"
  STRIPE_WEBHOOK_SECRET: "ReplaceWithProductionStripeWebhookSecret"
  RAZORPAY_KEY_ID: "ReplaceWithProductionRazorpayKeyId"
  RAZORPAY_KEY_SECRET: "ReplaceWithProductionRazorpayKeySecret"
  RAZORPAY_WEBHOOK_SECRET: "ReplaceWithProductionRazorpayWebhookSecret"
  EMAIL_HOST_USER: "contact@yuvro.ai"
  EMAIL_HOST_PASSWORD: "ReplaceWithProductionEmailPassword"

# Components configuration for production
components:
  backend:
    enabled: true
    replicas: 2  # Default scale
  frontend:
    enabled: false  # YHub is backend-only
  database:
    enabled: false  # Use AWS RDS instead

# Resource requests and limits for production
resources:
  backend:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

# Service configuration for production (LoadBalancer for ALB)
service:
  type: LoadBalancer
  backend:
    port: 80
    targetPort: 8000
