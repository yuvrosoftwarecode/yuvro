{{- if .Values.components.frontend.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: yhub-frontend
  namespace: {{ .Values.namespace }}
  labels:
    app: yhub
    component: frontend
spec:
  replicas: {{ .Values.components.frontend.replicas }}
  selector:
    matchLabels:
      app: yhub
      component: frontend
  template:
    metadata:
      labels:
        app: yhub
        component: frontend
    spec:
      containers:
        - name: frontend
          image: yuvro-yhub-frontend:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: yhub-frontend-config
          resources:
            {{- toYaml .Values.resources.frontend | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: yhub-yhub-frontend
  namespace: {{ .Values.namespace }}
  labels:
    app: yhub
    component: frontend
spec:
  selector:
    app: yhub
    component: frontend
  ports:
    - port: {{ .Values.service.frontend.port }}
      targetPort: {{ .Values.service.frontend.targetPort }}
      nodePort: {{ .Values.service.frontend.nodePort }}
      name: http
  type: {{ .Values.service.type }}
{{- end }}
