{{- range $key, $component := .Values.components }}
{{- if $component.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-{{ $key }}
  namespace: yuvro-ns
  labels:
    app: yuvro
    component: {{ $key }}
    release: {{ $.Release.Name }}
spec:
  replicas: {{ $component.replicas | default 1 }}
  selector:
    matchLabels:
      app: yuvro
      component: {{ $key }}
      release: {{ $.Release.Name }}
  template:
    metadata:
      labels:
        app: yuvro
        component: {{ $key }}
        release: {{ $.Release.Name }}
    spec:
      containers:
        - name: {{ $key }}
          image: yuvro-{{ $key }}:{{ $.Values.image.tag }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            - containerPort: {{ if contains "frontend" $key }}3000{{ else if contains "backend" $key }}8000{{ else if eq $key "code-executor" }}8009{{ else }}8000{{ end }}
          envFrom:
            - configMapRef:
                name: {{ $.Release.Name }}-{{ $key }}-config
            - secretRef:
                name: {{ $.Release.Name }}-{{ $key }}-secrets
          resources:
            {{- if contains "backend" $key }}
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
            {{- else if contains "frontend" $key }}
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
            {{- end }}
          readinessProbe:
            httpGet:
              path: /
              port: {{ if contains "frontend" $key }}3000{{ else if contains "backend" $key }}8000{{ else if eq $key "code-executor" }}8009{{ else }}8000{{ end }}
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: {{ if contains "frontend" $key }}3000{{ else if contains "backend" $key }}8000{{ else if eq $key "code-executor" }}8009{{ else }}8000{{ end }}
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
{{- end }}
{{- end }}
