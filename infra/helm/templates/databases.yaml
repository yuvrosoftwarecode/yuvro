{{- $apps := list "ycode" "ycampus" "ylabs" "ymarketplace" "yhub" }}
{{- $dbConfigs := dict "ycode" (dict "db" "ycode_backend_db" "port" "5432") "ycampus" (dict "db" "ycampus_backend_db" "port" "5433") "ylabs" (dict "db" "ylabs_backend_db" "port" "5434") "ymarketplace" (dict "db" "ymarketplace_backend_db" "port" "5436") "yhub" (dict "db" "yhub_backend_db" "port" "5435") }}

{{- range $app := $apps }}
{{- if index $.Values.components (printf "%s-backend" $app) }}
{{- if index (index $.Values.components (printf "%s-backend" $app)) "database" }}
{{- if (index (index $.Values.components (printf "%s-backend" $app)) "database").enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $app }}-postgres-pvc
  namespace: yuvro-ns
  labels:
    app: {{ $app }}
    component: database
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $app }}-db
  namespace: yuvro-ns
  labels:
    app: {{ $app }}
    component: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ $app }}
      component: database
  template:
    metadata:
      labels:
        app: {{ $app }}
        component: database
    spec:
      containers:
        - name: postgres
          image: postgres:15
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "{{ index (index $dbConfigs $app) "db" }}"
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              value: "password"
            - name: PGDATA
              value: "/var/lib/postgresql/data/pgdata"
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U postgres
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U postgres
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: {{ $app }}-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: yuvro-postgresql-{{ $app }}
  namespace: yuvro-ns
  labels:
    app: {{ $app }}
    component: database
spec:
  selector:
    app: {{ $app }}
    component: database
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  type: ClusterIP
{{- end }}
{{- end }}
{{- end }}
{{- end }}
