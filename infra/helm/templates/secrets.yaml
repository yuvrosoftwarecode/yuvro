{{- range $key, $component := .Values.components }}
{{- if $component.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $.Release.Name }}-{{ $key }}-secrets
  namespace: yuvro-ns
  labels:
    app: yuvro
    component: {{ $key }}
    release: {{ $.Release.Name }}
type: Opaque
stringData:
  {{- range $secretKey, $secretValue := $.Values.secrets }}
  {{ $secretKey }}: "{{ $secretValue }}"
  {{- end }}
{{- end }}
{{- end }}
