# YCampus Helm Chart Values

namespace: yuvro-ns

# Image configuration
image:
  pullPolicy: Never
  tag: "latest"

# Environment variables
env:
  DEPLOY_ENV: "local"
  DEPLOY_TYPE: "kubernetes"
  DEBUG: "True"
  APP_NAME: "ycampus"
  
  # Hosts & CORS
  ALLOWED_HOSTS: "*"
  CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003,http://localhost:3004"
  CSRF_TRUSTED_ORIGINS: "http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003,http://localhost:3004"
  
  # JWT Settings
  JWT_ACCESS_TOKEN_LIFETIME: "15"
  JWT_REFRESH_TOKEN_LIFETIME: "7"
  
  # Database
  DATABASE_URL: "postgresql://postgres:password@yuvro-postgresql-ycampus:5432/ycampus_backend_db"
  POSTGRES_DB: "ycampus_backend_db"
  POSTGRES_USER: "postgres"
  
  # Storage
  STORAGE_BACKEND: "s3"
  AWS_STORAGE_BUCKET_NAME: "yuvro-local"
  AWS_S3_REGION_NAME: "ap-south-1"
  AWS_S3_ENDPOINT_URL: "http://yuvro-minio:9000"
  AWS_S3_PUBLIC_ENDPOINT_URL: "http://localhost:9100"
  AWS_S3_ADDRESSING_STYLE: "path"
  AWS_QUERYSTRING_AUTH: "False"
  
  # Code Executor
  CODE_EXECUTOR_SERVICE_URL: "http://yuvro-code-executor:8009"
  
  # Email
  EMAIL_BACKEND: "django.core.mail.backends.smtp.EmailBackend"
  EMAIL_HOST: "smtp.hostinger.com"
  EMAIL_PORT: "465"
  EMAIL_USE_TLS: "False"
  EMAIL_USE_SSL: "True"
  DEFAULT_FROM_EMAIL: "contact@yuvro.ai"
  
  # Frontend
  VITE_API_URL: "http://localhost:8001"
  VITE_CODE_EXECUTOR_URL: "http://localhost:8009"

# Secrets
secrets:
  SECRET_KEY: "your-strong-secret-key-change-this"
  POSTGRES_PASSWORD: "password"
  AWS_ACCESS_KEY_ID: "minioadmin"
  AWS_SECRET_ACCESS_KEY: "minioadmin"
  EMAIL_HOST_USER: "contact@yuvro.ai"
  EMAIL_HOST_PASSWORD: "Yuvro@123"

# Components
components:
  backend:
    enabled: true
    replicas: 1
  frontend:
    enabled: true
    replicas: 1
  database:
    enabled: true
    replicas: 1
    storage: 10Gi

# Resource limits and requests
resources:
  backend:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  frontend:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"
  database:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"

# Service configuration
service:
  type: NodePort
  backend:
    port: 80
    targetPort: 8000
    nodePort: 30009
  frontend:
    port: 80
    targetPort: 80
    nodePort: 30001
