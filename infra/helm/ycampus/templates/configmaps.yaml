---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ycampus-backend-config
  namespace: {{ .Values.namespace }}
  labels:
    app: ycampus
    component: backend
data:
  {{- range $key, $value := .Values.env }}
  {{ $key }}: "{{ $value }}"
  {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ycampus-frontend-config
  namespace: {{ .Values.namespace }}
  labels:
    app: ycampus
    component: frontend
data:
  VITE_API_URL: "{{ .Values.env.VITE_API_URL }}"
  VITE_CODE_EXECUTOR_URL: "{{ .Values.env.VITE_CODE_EXECUTOR_URL }}"
