version: '3.8'

services:
  localstack:
    image: localstack/localstack:latest
    container_name: localstack
    ports:
      - "4566:4566"
      - "4571:4571"
    environment:
      - DEBUG=1
      - SERVICES=s3,rds,iam,cloudwatch,sqs,sns
      - DOCKER_HOST=unix:///var/run/docker.sock
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - LOCALSTACK_HOSTNAME=localstack
      - LOCALSTACK_DOCKER_NETWORK=localstack-network
      - DATA_DIR=/tmp/localstack/data
      - PERSISTENCE=1
    volumes:
      - "${LOCALSTACK_DATA_DIR:-./.localstack}:/tmp/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "./init-aws.sh:/docker-entrypoint-initaws.d/init-aws.sh"
    networks:
      - localstack-network
    healthcheck:
      test: ["CMD", "awslocal", "s3", "ls"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  localstack-ui:
    image: localstack/localstack-ui:latest
    container_name: localstack-ui
    ports:
      - "4571:4571"
    environment:
      - LOCALSTACK_HOSTNAME=localstack
      - LOCALSTACK_API_ENDPOINT=http://localstack:4566
    depends_on:
      - localstack
    networks:
      - localstack-network

networks:
  localstack-network:
    driver: bridge
