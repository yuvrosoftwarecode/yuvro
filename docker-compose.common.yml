services:
  yuvro-code-executor:
    build:
      context: ./yuvro-code-executer
      dockerfile: Dockerfile
    ports:
      - "8002:8002"
      - "9002:9002"  # Prometheus metrics
    env_file:
      - ./yuvro-code-executer/.env
    volumes:
      - ./yuvro-code-executer:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - executor

networks:
  executor:
    external: true
