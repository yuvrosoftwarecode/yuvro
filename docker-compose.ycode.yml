services:
  ycode-db:
    image: postgres:15
    env_file:
      - ./ycode-backend-api/.env.local
    volumes:
      - ycode_postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: on-failure
    networks:
      - ycode

  ycode-backend:
    build:
      context: ./ycode-backend-api
      dockerfile: Dockerfile
    ports:
      - "8001:8000"  # Django API (tech.md: 8001)
      - "9000:9001"  # Prometheus metrics
    env_file:
      - ./ycode-backend-api/.env.local
    depends_on:
      ycode-db:
        condition: service_healthy
    command: >
      sh -c "python manage.py makemigrations &&
             python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: on-failure
    networks:
      - ycode
      - executor

  ycode-frontend:
    build:
      context: ./ycode-web
      dockerfile: Dockerfile
      target: development
    env_file:
      - ./ycode-web/.env.local
    stdin_open: true
    tty: true
    depends_on:
      ycode-backend:
        condition: service_healthy
    command: npm run dev -- --host 0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: on-failure
    networks:
      - ycode
      - executor

volumes:
  ycode_postgres_data:

networks:
  ycode:
    driver: bridge
  executor:
    external: true
