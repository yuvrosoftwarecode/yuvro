services:
  ycode-db:
    image: postgres:15
    env_file:
      - ./ycode-backend-api/.env.local
      - path: ./ycode-backend-api/.env.local-secrets
        required: false
    volumes:
      - ycode_postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: on-failure
    networks:
      - ycode

  ycode-backend:
    build:
      context: ./ycode-backend-api
      dockerfile: Dockerfile
      target: development
      args:
        - CACHEBUST=${CACHEBUST:-1}
    ports:
      - "8000:8000"  # Django API (host: 8000)
      - "9000:9001"  # Prometheus metrics
    env_file:
      - ./ycode-backend-api/.env.local
      - path: ./ycode-backend-api/.env.local-secrets
        required: false
    command: >
      sh -c "python manage.py makemigrations &&
             python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: on-failure
    networks:
      - ycode
      - executor
      - yuvro-storage

  ycode-frontend:
    build:
      context: ./ycode-web
      dockerfile: Dockerfile
      target: development
    env_file:
      - ./ycode-web/.env.local
      - path: ./ycode-web/.env.local-secrets
        required: false
    volumes:
      - ./ycode-web:/app
      - /app/node_modules
    stdin_open: true
    tty: true
    depends_on:
      ycode-backend:
        condition: service_started
    command: npm run dev -- --host 0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: on-failure
    networks:
      - ycode
      - executor

volumes:
  ycode_postgres_data:

networks:
  ycode:
    driver: bridge
  executor:
    external: true
  yuvro-storage:
    external: true
    name: yuvro_yuvro-storage
