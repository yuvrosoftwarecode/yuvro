services:
  ycode-db:
    image: postgres:15
    env_file:
      - ./yc-backend-api/.env.prod
    volumes:
      - ycode_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ycode

  ycode-backend:
    build:
      context: ./yc-backend-api
      dockerfile: Dockerfile
      target: production
    env_file:
      - ./yc-backend-api/.env.prod
    depends_on:
      ycode-db:
        condition: service_healthy
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn --bind 0.0.0.0:8000 yc-backend-api.wsgi:application"
    networks:
      - ycode
      - executor  # Connect to executor network

  ycode-frontend:
    build:
      context: ./yc-web
      dockerfile: Dockerfile
      target: production
      args:
        - BACKEND_API_BASE_URL=${BACKEND_API_BASE_URL}
    env_file:
      - ./yc-web/.env.prod
    ports:
      - "80:80"
    depends_on:
      - ycode-backend
    restart: unless-stopped
    networks:
      - ycode
      - executor  # Connect to executor network

volumes:
  ycode_postgres_data:

networks:
  ycode:
    driver: bridge
  executor:
    external: true
