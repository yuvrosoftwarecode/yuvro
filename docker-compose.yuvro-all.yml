services:
  # ----------------------------------------
  # YLabs Services
  # ----------------------------------------
  ylabs-db:
    image: postgres:15
    env_file:
      - path: ./ylabs-backend-api/.env.local
        required: false
      - path: ./ylabs-backend-api/.env.local-secrets
        required: false
    volumes:
      - ylabs_postgres_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: on-failure
    networks:
      - ylabs

  ylabs-backend:
    build:
      context: ./ylabs-backend-api
      dockerfile: Dockerfile
    ports:
      - "8002:8000"
      - "9003:9001"
    env_file:
      - path: ./ylabs-backend-api/.env.local
        required: false
      - path: ./ylabs-backend-api/.env.local-secrets
        required: false
    depends_on:
      ylabs-db:
        condition: service_healthy
    volumes:
      - ./ylabs-backend-api:/app
      - ./workspaces:/workspaces
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: on-failure
    networks:
      - ylabs
      - yuvro-storage

  ylabs-frontend:
    build:
      context: ./ylabs-web
      dockerfile: Dockerfile
      target: development
    env_file:
      - path: ./ylabs-web/.env.local
        required: false
      - path: ./ylabs-web/.env.local-secrets
        required: false
    volumes:
      - ./ylabs-web:/app
      - /app/node_modules
    ports:
      - "3002:3000"
    stdin_open: true
    tty: true
    depends_on:
      ylabs-backend:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: on-failure
    networks:
      - ylabs

  # ----------------------------------------
  # YHub Services
  # ----------------------------------------
  yhub-db:
    image: postgres:15
    env_file:
      - path: ./yhub-backend-api/.env.local
        required: false
      - path: ./yhub-backend-api/.env.local-secrets
        required: false
    volumes:
      - yhub_postgres_data:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: on-failure
    networks:
      - yhub

  yhub-backend:
    build:
      context: ./yhub-backend-api
      dockerfile: Dockerfile
    ports:
      - "8003:8000"
      - "9004:9001"
    env_file:
      - path: ./yhub-backend-api/.env.local
        required: false
      - path: ./yhub-backend-api/.env.local-secrets
        required: false
    depends_on:
      yhub-db:
        condition: service_healthy
    volumes:
      - ./yhub-backend-api:/app
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: on-failure
    networks:
      - yhub
      - executor
      - yuvro-storage

  # ----------------------------------------
  # Yuvro Code Executor & Storage
  # ----------------------------------------
  yuvro-code-executor:
    image: yuvro-yuvro-code-executor:latest
    ports:
      - "8009:8009"  
      - "9002:9002" 
      - "8010:8010"
    env_file:
      - ./yuvro-code-executer/.env.local
      - path: ./yuvro-code-executer/.env.local-secrets
        required: false
    environment:
      - WORKSPACES_ROOT=/workspaces
      - YLABS_BACKEND_URL=http://ylabs-backend:8000  
    volumes:
      - ./workspaces:/workspaces  
      - ./yuvro-code-executer:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8009/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: on-failure
    networks:
      - executor
      - ylabs  

  yuvro-minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data --console-address ":9101"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9100:9000"
      - "9101:9101"
    volumes:
      - yuvro_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: on-failure
    networks:
      - yuvro-storage

  yuvro-minio-init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    depends_on:
      yuvro-minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://yuvro-minio:9000 minioadmin minioadmin &&
      (mc mb --ignore-existing local/yuvro-local || true) &&
      mc anonymous set download local/yuvro-local || true
      "
    networks:
      - yuvro-storage
    restart: "no"

volumes:
  ylabs_postgres_data:
  yhub_postgres_data:
  yuvro_minio_data:

networks:
  ylabs:
    name: yuvro_ylabs
  yhub:
    driver: bridge
  executor:
    name: yuvro_executor
  yuvro-storage:
    name: yuvro_storage
