services:
  ycode-db:
    image: postgres:15
    env_file:
      - ./ycode-backend-api/.env
    volumes:
      - ycode_postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ycode

  ycode-backend:
    build:
      context: ./ycode-backend-api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"  # Django API
      - "9000:9001"  # Prometheus metrics
    env_file:
      - ./ycode-backend-api/.env
    volumes:
      - ./ycode-backend-api:/app
      - /app/venv
    depends_on:
      ycode-db:
        condition: service_healthy
    command: >
      sh -c "python manage.py makemigrations &&
             python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - ycode
      - executor  # Connect to executor network

  ycode-frontend:
    build:
      context: ./ycode-web
      dockerfile: Dockerfile
      target: development
    ports:
      - "3000:3000"
    env_file:
      - ./ycode-web/.env
    volumes:
      - ./ycode-web:/app
      - /app/node_modules
    stdin_open: true
    tty: true
    depends_on:
      - ycode-backend
    command: npm run dev -- --host 0.0.0.0
    networks:
      - ycode
      - executor  # Connect to executor network

volumes:
  ycode_postgres_data:

networks:
  ycode:
    driver: bridge
  executor:
    external: true
