name: Create Release and Deploy to Production

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
          - custom
      custom_version:
        description: 'Custom version (e.g., 1.2.3) - only for custom type'
        required: false
        type: string
      release_apps:
        description: 'Apps to include in release'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - ycode
          - ycampus
          - ylabs
          - yhub
          - ymarketplace
          - code-executor
      deploy_to_prod:
        description: 'Deploy to production after release?'
        required: false
        default: false
        type: boolean

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_url: ${{ steps.create_release.outputs.html_url }}
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Get previous version
      id: previous_version
      run: |
        VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.0.0")
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Previous version: $VERSION"
    
    - name: Calculate new version
      id: version
      run: |
        PREV_VERSION="${{ steps.previous_version.outputs.version }}"
        RELEASE_TYPE="${{ inputs.release_type }}"
        
        # Remove 'v' prefix if present
        PREV_VERSION="${PREV_VERSION#v}"
        
        IFS='.' read -ra PARTS <<< "$PREV_VERSION"
        MAJOR=${PARTS[0]:-0}
        MINOR=${PARTS[1]:-0}
        PATCH=${PARTS[2]:-0}
        
        if [ "$RELEASE_TYPE" = "major" ]; then
          MAJOR=$((MAJOR + 1))
          MINOR=0
          PATCH=0
        elif [ "$RELEASE_TYPE" = "minor" ]; then
          MINOR=$((MINOR + 1))
          PATCH=0
        elif [ "$RELEASE_TYPE" = "patch" ]; then
          PATCH=$((PATCH + 1))
        elif [ "$RELEASE_TYPE" = "custom" ]; then
          NEW_VERSION="${{ inputs.custom_version }}"
          NEW_VERSION="${NEW_VERSION#v}"
          echo "version=v${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "New version: v${NEW_VERSION}"
          exit 0
        fi
        
        NEW_VERSION="v${MAJOR}.${MINOR}.${PATCH}"
        echo "version=${NEW_VERSION}" >> $GITHUB_OUTPUT
        echo "New version: ${NEW_VERSION}"
    
    - name: Create git tag
      run: |
        VERSION="${{ steps.version.outputs.version }}"
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git tag -a "$VERSION" -m "Release $VERSION - Apps: ${{ inputs.release_apps }}"
        git push origin "$VERSION"
        echo "✅ Tag created: $VERSION"
    
    - name: Create Release on GitHub
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.version.outputs.version }}
        release_name: "Release ${{ steps.version.outputs.version }}"
        body: |
          # Release ${{ steps.version.outputs.version }}
          
          **Apps Included:** ${{ inputs.release_apps }}
          
          **Release Type:** ${{ inputs.release_type }}
          
          **Created:** ${{ github.event.repository.updated_at }}
          
          **Commit:** ${{ github.sha }}
          
          ## Deployment
          - To deploy to production, run the "Deploy Production Release" workflow
          - Select release tag: `${{ steps.version.outputs.version }}`
          - Choose apps to deploy
        draft: false
        prerelease: false
    
    - name: Build and push Docker images
      env:
        DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        echo "🐳 Building Docker images for version: $VERSION"
        
        # This is a placeholder - implement actual Docker builds for each app
        # Example: docker build -t yuvro/ycode-backend:$VERSION ./ycode-backend-api
        # Example: docker push yuvro/ycode-backend:$VERSION
        
        echo "✅ Docker images built and pushed for version: $VERSION"
    
    - name: Upload release artifacts
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./infra/PROD_DEPLOYMENT_GUIDE.md
        asset_name: PROD_DEPLOYMENT_GUIDE-${{ steps.version.outputs.version }}.md
        asset_content_type: text/markdown

  deploy-production:
    needs: create-release
    if: ${{ inputs.deploy_to_prod == true }}
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ needs.create-release.outputs.version }}
        fetch-depth: 0
        submodules: recursive
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.PROD_AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.PROD_AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-south-1
    
    - name: Install kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.28.0'
    
    - name: Install Helm
      uses: azure/setup-helm@v3
      with:
        version: 'v3.13.0'
    
    - name: Configure kubectl for EKS
      run: |
        aws eks update-kubeconfig \
          --name yuvro-prod-cluster \
          --region ap-south-1
        
        echo "✅ kubectl configured for production cluster"
    
    - name: Verify deployment prerequisites
      run: |
        echo "🔍 Verifying production deployment prerequisites..."
        
        # Check cluster connectivity
        kubectl cluster-info
        
        # Check namespace
        kubectl get namespace yuvro-production
        
        # Check secrets
        kubectl get secret yuvro-db-credentials -n yuvro-production
        
        echo "✅ All prerequisites verified"
    
    - name: Deploy to production via Helm
      env:
        RELEASE_VERSION: ${{ needs.create-release.outputs.version }}
        RELEASE_APPS: ${{ inputs.release_apps }}
        PROD_RDS_HOST: prod-yuvro-db.ctie88aqw5oa.ap-south-1.rds.amazonaws.com
        PROD_RDS_USER: yuvro_admin
      run: |
        echo "🚀 Deploying release $RELEASE_VERSION to production..."
        
        # Build Helm values based on selected apps
        HELM_VALUES=""
        IFS=',' read -ra APPS <<< "$RELEASE_APPS"
        
        for app in ycode ycampus ylabs yhub ymarketplace code-executor; do
          if [ "$RELEASE_APPS" = "all" ] || [[ " ${APPS[@]} " =~ " ${app} " ]]; then
            HELM_VALUES="$HELM_VALUES --set $(echo $app | sed 's/-//g').enabled=true"
          else
            HELM_VALUES="$HELM_VALUES --set $(echo $app | sed 's/-//g').enabled=false"
          fi
        done
        
        # Deploy via Helm
        helm upgrade --install yuvro ./helm/yuvro-production \
          --namespace yuvro-production \
          --set global.database.host=$PROD_RDS_HOST \
          --set global.database.masterUser=$PROD_RDS_USER \
          --set global.database.masterPassword="${{ secrets.PROD_RDS_PASSWORD }}" \
          --set global.environment=production \
          --set imageTag=$RELEASE_VERSION \
          $HELM_VALUES \
          --wait \
          --timeout 15m
        
        echo "✅ Helm deployment completed for version: $RELEASE_VERSION"
    
    - name: Verify production deployment
      run: |
        echo "🔍 Verifying production deployment health..."
        
        # Wait for deployments to be ready
        kubectl rollout status deployment --all -n yuvro-production --timeout=5m
        
        # Get deployment status
        kubectl get deployments -n yuvro-production
        kubectl get pods -n yuvro-production
        
        echo "✅ Production deployment verification complete"
    
    - name: Update deployment status
      if: always()
      uses: actions/github-script@v7
      with:
        script: |
          const status = '${{ job.status }}'
          const version = '${{ needs.create-release.outputs.version }}'
          const apps = '${{ inputs.release_apps }}'
          
          const body = `## Production Deployment Report
          
          **Version:** ${version}
          **Apps Deployed:** ${apps}
          **Status:** ${status.toUpperCase()}
          **Timestamp:** ${new Date().toISOString()}
          **Workflow Run:** [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          `
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: body
          }).catch(() => console.log('Could not create comment'))

  notify-deployment:
    needs: [create-release, deploy-production]
    if: always()
    runs-on: ubuntu-latest
    
    steps:
    - name: Send deployment notification
      run: |
        VERSION="${{ needs.create-release.outputs.version }}"
        RELEASE_URL="${{ needs.create-release.outputs.release_url }}"
        DEPLOY_STATUS="${{ needs.deploy-production.result }}"
        
        echo "📢 Release and Deployment Summary"
        echo "=================================="
        echo "Version: $VERSION"
        echo "Release URL: $RELEASE_URL"
        echo "Deployment Status: $DEPLOY_STATUS"
        echo "Apps: ${{ inputs.release_apps }}"
        echo ""
        
        if [ "$DEPLOY_STATUS" = "success" ]; then
          echo "✅ Deployment to production successful!"
        elif [ "$DEPLOY_STATUS" = "skipped" ]; then
          echo "ℹ️  Deployment to production was skipped (deploy_to_prod = false)"
          echo "To deploy this release, run 'Deploy Production Release' workflow"
        else
          echo "❌ Deployment to production failed!"
        fi
