name: Deploy to EC2 Dev

on:
  workflow_dispatch:
    inputs:
      deploy_branch:
        description: 'Git branch to deploy to EC2 dev'
        required: true
        default: 'main'
        type: choice
        options:
          - main
          - develop
      deploy_app:
        description: 'App to deploy'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - ycode
          - ycampus
          - ylabs
          - yhub
          - code-executor

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.DEPLOY_AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.DEPLOY_AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-south-1
    
    - name: Set up OpenTofu
      uses: opentofu/setup-opentofu@v1
      with:
        version: 1.8.0
    
    - name: Configure SSH key
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.DEPLOY_EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/yuvro-dev.pem
        chmod 400 ~/.ssh/yuvro-dev.pem
        echo "SSH key configured"
    
    - name: Deploy to EC2
      env:
        DEPLOY_ENV: dev
        DEPLOY_BRANCH: ${{ inputs.deploy_branch }}
        DEPLOY_APP: ${{ inputs.deploy_app }}
        SSH_KEY_PATH: /home/runner/.ssh/yuvro-dev.pem
      run: |
        echo "🚀 Deploying $DEPLOY_APP to dev [branch=$DEPLOY_BRANCH]..."
        
        if [ "$DEPLOY_APP" = "all" ]; then
          make deploy-all
        elif [ "$DEPLOY_APP" = "code-executor" ]; then
          make deploy-code-executor
        else
          make deploy-$DEPLOY_APP
        fi
        
        echo "✅ Deployment complete!"