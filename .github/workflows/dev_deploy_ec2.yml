name: Dev - Deploy to EC2

on:
  workflow_dispatch:
    inputs:
      deploy_branch:
        description: 'Git branch to deploy to EC2 dev'
        required: true
        default: 'main'
        type: string
      deploy_app:
        description: 'App to deploy'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - ycode
          - ycampus
          - ylabs
          - yhub
          - ymarketplace
          - code-executor

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.deploy_branch }}
        fetch-depth: 0
        submodules: false
    
    - name: Disable ymarketplace submodule for GitHub Actions
      run: |
        echo "🔧 Removing ymarketplace submodule from git config (temporary)"
        
        # Remove ymarketplace submodule from local git config so it won't be fetched
        git config --file .gitmodules --remove-section submodule.ymarketplace 2>/dev/null || true
        git config --remove-section submodule.ymarketplace 2>/dev/null || true
        
        # Clean up any stale submodule directories
        rm -rf .git/modules/ymarketplace 2>/dev/null || true
        rm -rf ymarketplace 2>/dev/null || true
        
        echo "✅ ymarketplace submodule disabled"
        echo "ℹ️  It will be cloned on EC2 by the deployment script"
        echo "📱 App to deploy: ${{ inputs.deploy_app }}"
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.DEPLOY_AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.DEPLOY_AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-south-1
    
    - name: Configure SSH key
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.DEPLOY_EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/yuvro-dev.pem
        chmod 400 ~/.ssh/yuvro-dev.pem
        echo "SSH key configured"
    
    - name: Set up OpenTofu
      uses: opentofu/setup-opentofu@v1
      with:
        version: 1.8.0
    
    - name: Deploy to EC2
      env:
        DEPLOY_ENV: dev
        DEPLOY_BRANCH: ${{ inputs.deploy_branch }}
        DEPLOY_APP: ${{ inputs.deploy_app }}
        SSH_KEY_PATH: /home/runner/.ssh/yuvro-dev.pem
      run: |
        echo "🚀 Deploying $DEPLOY_APP to dev [branch=$DEPLOY_BRANCH]..."
        
        if [ "$DEPLOY_APP" = "all" ]; then
          bash infra/scripts/deploy-all.sh "$DEPLOY_BRANCH"
        elif [ "$DEPLOY_APP" = "code-executor" ]; then
          bash infra/scripts/deploy-code-executor.sh "$DEPLOY_BRANCH"
        else
          bash infra/scripts/deploy-$DEPLOY_APP.sh "$DEPLOY_BRANCH"
        fi
        
        echo "✅ Deployment of $DEPLOY_APP from branch '$DEPLOY_BRANCH' complete!"
