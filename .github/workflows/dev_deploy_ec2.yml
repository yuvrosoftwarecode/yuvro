name: Dev - Deploy to EC2

on:
  workflow_dispatch:
    inputs:
      deploy_branch:
        description: 'Git branch to deploy to EC2 dev'
        required: true
        default: 'main'
        type: string
      deploy_app:
        description: 'App to deploy'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - ycode
          - ycampus
          - ylabs
          - yhub
          - ymarketplace
          - code-executor

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.deploy_branch }}
        fetch-depth: 0
        submodules: false
    
    - name: Setup SSH for Git submodules
      env:
        SSH_KEY: ${{ secrets.DEPLOY_EC2_SSH_PRIVATE_KEY }}
      run: |
        mkdir -p ~/.ssh
        echo "$SSH_KEY" > ~/.ssh/github_key
        chmod 600 ~/.ssh/github_key
        
        cat >> ~/.ssh/config << EOF
        Host github.com
          HostName github.com
          User git
          IdentityFile ~/.ssh/github_key
          StrictHostKeyChecking no
        EOF
        chmod 600 ~/.ssh/config
        
        # Test SSH connection
        ssh -o ConnectTimeout=5 git@github.com || true
        echo "✅ SSH configured for git@github.com"
    
    - name: Initialize Git submodules
      run: |
        echo "📦 Initializing git submodules..."
        git submodule sync
        git submodule update --init --recursive
        echo "✅ Submodules initialized"
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.DEPLOY_AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.DEPLOY_AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-south-1
    
    - name: Configure SSH key
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.DEPLOY_EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/yuvro-dev.pem
        chmod 400 ~/.ssh/yuvro-dev.pem
        echo "✅ SSH key configured"
    
    - name: Set up OpenTofu
      uses: opentofu/setup-opentofu@v1
      with:
        version: 1.8.0
    
    - name: Deploy to EC2
      env:
        DEPLOY_ENV: dev
        DEPLOY_BRANCH: ${{ inputs.deploy_branch }}
        DEPLOY_APP: ${{ inputs.deploy_app }}
        SSH_KEY_PATH: /home/runner/.ssh/yuvro-dev.pem
      run: |
        echo "🚀 Deploying $DEPLOY_APP to dev [branch=$DEPLOY_BRANCH]..."
        
        if [ "$DEPLOY_APP" = "all" ]; then
          bash infra/scripts/deploy-all.sh "$DEPLOY_BRANCH"
        elif [ "$DEPLOY_APP" = "code-executor" ]; then
          bash infra/scripts/deploy-code-executor.sh "$DEPLOY_BRANCH"
        else
          bash infra/scripts/deploy-$DEPLOY_APP.sh "$DEPLOY_BRANCH"
        fi
        
        echo "✅ Deployment of $DEPLOY_APP from branch '$DEPLOY_BRANCH' complete!"
