name: Prod - Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        type: string
      release_notes:
        description: 'Release notes'
        required: false
        type: string

permissions:
  contents: write
  id-token: write

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY_PREFIX: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-south-1.amazonaws.com

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      release_version: ${{ inputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version format
        run: |
          if ! [[ "${{ inputs.version }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Invalid version format. Use v1.0.0"
            exit 1
          fi
          echo "✅ Version format valid: ${{ inputs.version }}"

      - name: Check if release already exists
        run: |
          if git rev-parse "${{ inputs.version }}" >/dev/null 2>&1; then
            echo "❌ Release tag already exists: ${{ inputs.version }}"
            exit 1
          fi
          echo "✅ Release tag is new"

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ inputs.version }}
          release_name: Release ${{ inputs.version }}
          body: |
            ## Release ${{ inputs.version }}
            
            ${{ inputs.release_notes || 'No release notes provided' }}
            
            ### Docker Images
            All images have been built and pushed to AWS ECR:
            - `${{ env.ECR_REGISTRY_PREFIX }}/ycode-backend:${{ inputs.version }}`
            - `${{ env.ECR_REGISTRY_PREFIX }}/ycode-frontend:${{ inputs.version }}`
            - `${{ env.ECR_REGISTRY_PREFIX }}/ycampus-backend:${{ inputs.version }}`
            - `${{ env.ECR_REGISTRY_PREFIX }}/ycampus-frontend:${{ inputs.version }}`
            - `${{ env.ECR_REGISTRY_PREFIX }}/ylabs-backend:${{ inputs.version }}`
            - `${{ env.ECR_REGISTRY_PREFIX }}/ylabs-frontend:${{ inputs.version }}`
            - `${{ env.ECR_REGISTRY_PREFIX }}/yhub-backend:${{ inputs.version }}`
            - `${{ env.ECR_REGISTRY_PREFIX }}/ymarketplace-backend:${{ inputs.version }}`
            - `${{ env.ECR_REGISTRY_PREFIX }}/ymarketplace-frontend:${{ inputs.version }}`
            - `${{ env.ECR_REGISTRY_PREFIX }}/code-executor:${{ inputs.version }}`
          draft: false
          prerelease: false

  build-and-push-images:
    needs: create-release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - { name: 'ycode-backend', path: 'ycode-backend-api', dockerfile: 'ycode-backend-api/Dockerfile' }
          - { name: 'ycode-frontend', path: 'ycode-web', dockerfile: 'ycode-web/Dockerfile' }
          - { name: 'ycampus-backend', path: 'ycampus-backend-api', dockerfile: 'ycampus-backend-api/Dockerfile' }
          - { name: 'ycampus-frontend', path: 'ycampus-web', dockerfile: 'ycampus-web/Dockerfile' }
          - { name: 'ylabs-backend', path: 'ylabs-backend-api', dockerfile: 'ylabs-backend-api/Dockerfile' }
          - { name: 'ylabs-frontend', path: 'ylabs-web', dockerfile: 'ylabs-web/Dockerfile' }
          - { name: 'yhub-backend', path: 'yhub-backend-api', dockerfile: 'yhub-backend-api/Dockerfile' }
          - { name: 'ymarketplace-backend', path: 'ymarketplace/backend', dockerfile: 'ymarketplace/backend/Dockerfile' }
          - { name: 'ymarketplace-frontend', path: 'ymarketplace/frontend', dockerfile: 'ymarketplace/frontend/Dockerfile' }
          - { name: 'code-executor', path: 'yuvro-code-executer', dockerfile: 'yuvro-code-executer/Dockerfile' }
      max-parallel: 3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registries: ${{ secrets.AWS_ACCOUNT_ID }}

      - name: Build and push - ${{ matrix.service.name }}
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service.path }}
          file: ./${{ matrix.service.dockerfile }}
          push: true
          tags: |
            ${{ env.ECR_REGISTRY_PREFIX }}/${{ matrix.service.name }}:${{ needs.create-release.outputs.release_version }}
            ${{ env.ECR_REGISTRY_PREFIX }}/${{ matrix.service.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image pushed
        run: |
          echo "✅ Pushed: ${{ matrix.service.name }}"
          echo "   Version: ${{ needs.create-release.outputs.release_version }}"
          echo "   URI: ${{ env.ECR_REGISTRY_PREFIX }}/${{ matrix.service.name }}:${{ needs.create-release.outputs.release_version }}"

  build-summary:
    needs: [create-release, build-and-push-images]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Build and release summary
        run: |
          echo "=========================================="
          echo "🎉 Release ${{ needs.create-release.outputs.release_version }} Complete!"
          echo "=========================================="
          echo ""
          echo "✅ GitHub Release created"
          echo "✅ All 10 Docker images built and pushed to ECR"
          echo ""
          echo "ECR Registry: ${{ env.ECR_REGISTRY_PREFIX }}"
          echo ""
          echo "📝 Next: Deploy using 'Prod - Deploy Release to K8s' workflow"
