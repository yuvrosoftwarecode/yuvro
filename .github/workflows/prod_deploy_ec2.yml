name: Production EC2 Deployment

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Select release version'
        required: true
        type: choice
        options:
          - latest
          - v1.0.0
          - v0.9.0
          - v0.8.0
          - v0.7.0
          - custom
      custom_branch:
        description: 'Custom branch (if "custom" selected above)'
        required: false
        type: string
      action:
        description: 'Action to perform'
        required: true
        default: 'deploy-all'
        type: choice
        options:
          - deploy-infra
          - deploy-all
          - deploy-ycode
          - deploy-ycampus
          - deploy-ylabs
          - deploy-yhub
          - deploy-ymarketplace
          - deploy-code-executor

env:
  DEPLOY_ENV: prod
  DEPLOY_INFRA_TYPE: ec2
  DEPLOY_BRANCH: ${{ github.event.inputs.release == 'custom' && github.event.inputs.custom_branch || github.event.inputs.release }}
  AWS_REGION: us-east-1
  GITHUB_OWNER: yuvro

permissions:
  contents: read
  id-token: write

jobs:
  validate-release:
    name: Validate Release Selection
    runs-on: ubuntu-latest
    outputs:
      deploy_branch: ${{ steps.set_branch.outputs.deploy_branch }}
    steps:
      - name: Validate and Set Branch
        id: set_branch
        run: |
          RELEASE="${{ github.event.inputs.release }}"
          CUSTOM="${{ github.event.inputs.custom_branch }}"
          
          if [ "$RELEASE" = "custom" ]; then
            if [ -z "$CUSTOM" ]; then
              echo "❌ Custom branch selected but not provided"
              exit 1
            fi
            BRANCH="$CUSTOM"
          else
            BRANCH="$RELEASE"
          fi
          
          echo "deploy_branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "✅ Deploying from: $BRANCH"

  deploy-infrastructure:
    name: Deploy Infrastructure (EC2)
    runs-on: ubuntu-latest
    needs: validate-release
    if: ${{ github.event.inputs.action == 'deploy-infra' }}
    environment:
      name: production
      url: https://yuvro.ai

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-release.outputs.deploy_branch }}
          fetch-depth: 0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: latest

      - name: Terraform Init
        run: |
          cd infra/opentofu/prod_ec2
          terraform init

      - name: Terraform Plan
        run: |
          cd infra/opentofu/prod_ec2
          terraform plan -out=tfplan_prod \
            -var github_token="${{ secrets.GITHUB_TOKEN_GHCR }}"

      - name: Review and Approve
        run: |
          echo "⏳ Waiting for approval..."
          echo "Plan saved. Review in PR comments."

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main'
        run: |
          cd infra/opentofu/prod_ec2
          terraform apply -auto-approve tfplan_prod \
            -var github_token="${{ secrets.GITHUB_TOKEN_GHCR }}"

      - name: Get Outputs
        if: github.ref == 'refs/heads/main'
        run: |
          cd infra/opentofu/prod_ec2
          echo "=== Infrastructure Outputs ===" >> $GITHUB_STEP_SUMMARY
          terraform output >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### EC2 Instance Details" >> $GITHUB_STEP_SUMMARY
          echo "- **Elastic IPs:** $(terraform output -raw ec2_elastic_ips)" >> $GITHUB_STEP_SUMMARY
          echo "- **RDS Endpoint:** $(terraform output -raw rds_endpoint)" >> $GITHUB_STEP_SUMMARY
          echo "- **S3 Bucket:** $(terraform output -raw uploads_bucket)" >> $GITHUB_STEP_SUMMARY

      - name: Output Deployment Info
        if: github.ref == 'refs/heads/main'
        run: |
          cd infra/opentofu/prod_ec2
          echo "## 🎯 Infrastructure Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Release Information" >> $GITHUB_STEP_SUMMARY
          echo "- **Release:** ${{ github.event.inputs.release }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch/Tag:** ${{ needs.validate-release.outputs.deploy_branch }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps:" >> $GITHUB_STEP_SUMMARY
          echo "1. Get EC2 instance IP: \`terraform output ec2_elastic_ips\`" >> $GITHUB_STEP_SUMMARY
          echo "2. Copy repository to EC2: \`scp -r -i /path/to/key.pem . ubuntu@<IP>:/home/ubuntu/yuvro\`" >> $GITHUB_STEP_SUMMARY
          echo "3. Run deployment: \`DEPLOY_ENV=prod DEPLOY_INFRA_TYPE=ec2 DEPLOY_BRANCH=${{ needs.validate-release.outputs.deploy_branch }} make deploy-all\`" >> $GITHUB_STEP_SUMMARY

  deploy-applications:
    name: Deploy Applications (EC2)
    runs-on: ubuntu-latest
    needs: validate-release
    if: ${{ github.event.inputs.action != 'deploy-infra' }}
    environment:
      name: production
      url: https://yuvro.ai

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-release.outputs.deploy_branch }}
          fetch-depth: 0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get EC2 Instance Info
        id: ec2_info
        run: |
          EC2_IPS=$(aws ec2 describe-instances \
            --filters "Name=tag:Environment,Values=prod" "Name=tag:DeployType,Values=EC2" "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].PublicIpAddress' \
            --region ${{ env.AWS_REGION }} \
            --output text)
          
          if [ -z "$EC2_IPS" ]; then
            echo "❌ No running EC2 instances found"
            exit 1
          fi
          
          EC2_IP=$(echo $EC2_IPS | awk '{print $1}')
          echo "ec2_ip=$EC2_IP" >> $GITHUB_OUTPUT
          echo "Found EC2 instance: $EC2_IP"

      - name: Deploy via SSH
        env:
          EC2_KEY: ${{ secrets.EC2_PRIVATE_KEY }}
          EC2_HOST: ${{ steps.ec2_info.outputs.ec2_ip }}
        run: |
          # Setup SSH key
          mkdir -p ~/.ssh
          echo "$EC2_KEY" > ~/.ssh/ec2_key.pem
          chmod 600 ~/.ssh/ec2_key.pem
          
          # SSH config
          cat > ~/.ssh/config << EOF
          Host ec2
            HostName $EC2_HOST
            User ubuntu
            IdentityFile ~/.ssh/ec2_key.pem
            StrictHostKeyChecking=no
            UserKnownHostsFile=/dev/null
          EOF
          
          # Test SSH connection
          ssh ec2 "echo ✓ SSH connection successful"

      - name: Execute Deployment Script
        env:
          EC2_KEY: ${{ secrets.EC2_PRIVATE_KEY }}
          EC2_HOST: ${{ steps.ec2_info.outputs.ec2_ip }}
        run: |
          mkdir -p ~/.ssh
          echo "$EC2_KEY" > ~/.ssh/ec2_key.pem
          chmod 600 ~/.ssh/ec2_key.pem
          
          cat > ~/.ssh/config << EOF
          Host ec2
            HostName $EC2_HOST
            User ubuntu
            IdentityFile ~/.ssh/ec2_key.pem
            StrictHostKeyChecking=no
            UserKnownHostsFile=/dev/null
          EOF
          
          # Copy repository to EC2
          echo "📦 Copying repository to EC2..."
          scp -r -q . ec2:/home/ubuntu/yuvro/
          
          # Execute deployment
          echo "🚀 Executing deployment on EC2 (Release: ${{ github.event.inputs.release }})..."
          ssh ec2 "cd /home/ubuntu/yuvro && bash infra/scripts/prod_ec2/deploy-${{ github.event.inputs.action }}.sh ${{ needs.validate-release.outputs.deploy_branch }}"

      - name: Verify Deployment
        env:
          EC2_KEY: ${{ secrets.EC2_PRIVATE_KEY }}
          EC2_HOST: ${{ steps.ec2_info.outputs.ec2_ip }}
        run: |
          mkdir -p ~/.ssh
          echo "$EC2_KEY" > ~/.ssh/ec2_key.pem
          chmod 600 ~/.ssh/ec2_key.pem
          
          cat > ~/.ssh/config << EOF
          Host ec2
            HostName $EC2_HOST
            User ubuntu
            IdentityFile ~/.ssh/ec2_key.pem
            StrictHostKeyChecking=no
            UserKnownHostsFile=/dev/null
          EOF
          
          echo "✅ Verifying deployment..."
          ssh ec2 "docker-compose -f docker-compose.prod.yml ps" || true

      - name: Generate Summary
        if: success()
        run: |
          EC2_IP="${{ steps.ec2_info.outputs.ec2_ip }}"
          echo "## 🎉 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Deployment Details" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** Production" >> $GITHUB_STEP_SUMMARY
          echo "- **Infra Type:** EC2" >> $GITHUB_STEP_SUMMARY
          echo "- **Release:** ${{ github.event.inputs.release }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch/Tag:** ${{ needs.validate-release.outputs.deploy_branch }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Action:** ${{ github.event.inputs.action }}" >> $GITHUB_STEP_SUMMARY
          echo "- **EC2 Instance:** $EC2_IP" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Service Endpoints" >> $GITHUB_STEP_SUMMARY
          echo "- YCode Frontend: http://$EC2_IP:3000" >> $GITHUB_STEP_SUMMARY
          echo "- YCode Backend: http://$EC2_IP:8000/api/" >> $GITHUB_STEP_SUMMARY
          echo "- YCampus Frontend: http://$EC2_IP:3001" >> $GITHUB_STEP_SUMMARY
          echo "- YCampus Backend: http://$EC2_IP:8001/api/" >> $GITHUB_STEP_SUMMARY
          echo "- YLabs Frontend: http://$EC2_IP:3002" >> $GITHUB_STEP_SUMMARY
          echo "- YLabs Backend: http://$EC2_IP:8002/api/" >> $GITHUB_STEP_SUMMARY
          echo "- YHub Backend: http://$EC2_IP:8003/api/" >> $GITHUB_STEP_SUMMARY
          echo "- YMarketplace Frontend: http://$EC2_IP:3004" >> $GITHUB_STEP_SUMMARY
          echo "- YMarketplace Backend: http://$EC2_IP:8004/api/" >> $GITHUB_STEP_SUMMARY
          echo "- Code Executor: http://$EC2_IP:8009/health" >> $GITHUB_STEP_SUMMARY

      - name: Notify on Failure
        if: failure()
        run: |
          echo "## ❌ Deployment Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Release:** ${{ github.event.inputs.release }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch/Tag:** ${{ needs.validate-release.outputs.deploy_branch }}" >> $GITHUB_STEP_SUMMARY
          echo "**Action:** ${{ github.event.inputs.action }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Troubleshooting:**" >> $GITHUB_STEP_SUMMARY
          echo "1. Check EC2 instance status" >> $GITHUB_STEP_SUMMARY
          echo "2. SSH into instance and check logs: \`docker-compose -f docker-compose.prod.yml logs -f\`" >> $GITHUB_STEP_SUMMARY
          echo "3. Review deployment script output above" >> $GITHUB_STEP_SUMMARY
