name: Dev - Deploy Infrastructure (EC2)

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
          - plan & apply
          - destroy

jobs:
  deploy-infra:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.DEPLOY_AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.DEPLOY_AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-south-1
    
    - name: Set up OpenTofu
      uses: opentofu/setup-opentofu@v1
      with:
        version: 1.8.0
    
    - name: Load Dev Secrets
      run: |
        if [ -f "ycode-backend-api/.env.dev-secrets" ]; then
          echo "✅ Found .env.dev-secrets, loading database credentials..."
          source ycode-backend-api/.env.dev-secrets
          # Export DB_MASTER_PASSWORD if DEV_DB_MASTER_PASSWORD is not already set
          if [ -z "$DEV_DB_MASTER_PASSWORD" ] && [ -n "$DB_MASTER_PASSWORD" ]; then
            echo "DB_MASTER_PASSWORD=$DB_MASTER_PASSWORD" >> $GITHUB_ENV
          fi
        else
          echo "⚠️  .env.dev-secrets not found, using GitHub secret"
          if [ -z "${{ secrets.DEV_DB_MASTER_PASSWORD }}" ]; then
            echo "❌ DEV_DB_MASTER_PASSWORD secret is required when .env.dev-secrets is not present"
            exit 1
          fi
          echo "DB_MASTER_PASSWORD=${{ secrets.DEV_DB_MASTER_PASSWORD }}" >> $GITHUB_ENV
        fi
    
    - name: Deploy Infrastructure (Dev)
      env:
        ACTION: ${{ inputs.action }}
        DEPLOY_ENV: dev
        AWS_REGION: ap-south-1
      run: |
        echo "🚀 OpenTofu Infrastructure Deployment [action=$ACTION]..."
        
        cd infra/opentofu/dev
        
        # Initialize
        tofu init
        
        if [ "$ACTION" = "plan" ]; then
          echo "📋 Planning infrastructure changes..."
          tofu plan -var-file=../dev.tfvars -var="db_master_password=$DB_MASTER_PASSWORD"
          
        elif [ "$ACTION" = "apply" ]; then
          echo "📋 Planning infrastructure changes..."
          tofu plan -var-file=../dev.tfvars -var="db_master_password=$DB_MASTER_PASSWORD" -out=tfplan
          
          echo "✅ Applying infrastructure changes..."
          tofu apply tfplan
          rm -f tfplan
          
          echo ""
          echo "📊 Infrastructure Outputs:"
          tofu output
          
        elif [ "$ACTION" = "plan & apply" ]; then
          echo "📋 Planning infrastructure changes..."
          tofu plan -var-file=../dev.tfvars -var="db_master_password=$DB_MASTER_PASSWORD" -out=tfplan
          
          echo ""
          echo "⏳ Waiting 3 seconds before applying (review the plan above)..."
          sleep 3
          
          echo "✅ Applying infrastructure changes..."
          tofu apply tfplan
          rm -f tfplan
          
          echo ""
          echo "📊 Infrastructure Outputs:"
          tofu output
          
        elif [ "$ACTION" = "destroy" ]; then
          echo "⚠️  DESTROYING infrastructure..."
          echo "This will delete all AWS resources in dev environment!"
          
          tofu plan -destroy -var-file=../dev.tfvars -var="db_master_password=$DB_MASTER_PASSWORD" -out=tfplan_destroy
          tofu apply tfplan_destroy
          rm -f tfplan_destroy
          
          echo "✅ Infrastructure destroyed"
        fi
        
        cd - > /dev/null
        echo "✅ Infrastructure operation complete!"
