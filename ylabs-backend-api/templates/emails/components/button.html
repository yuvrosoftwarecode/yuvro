<!-- Reusable Bulletproof CTA Button -->
<table role="presentation" border="0" cellpadding="0" cellspacing="0" class="mobile-button" style="margin: 28px 0 20px 0;">
  <tr>
    <td align="center" valign="middle" style="border-radius: 8px; background-color: #F7931E;">
      <!--[if mso]>
      <v:roundrect xmlns:v="urn:schemas-microsoft-com:vml" xmlns:w="urn:schemas-microsoft-com:office:word" href="{{ button_url }}" style="height:44px;v-text-anchor:middle;width:{{ button_width|default:'220px' }};" arcsize="18%" stroke="f" fillcolor="#F7931E">
        <w:anchorlock/>
        <center style="color:#ffffff;font-family:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;font-size:14px;font-weight:600;">
          {{ button_text }}
        </center>
      </v:roundrect>
      <![endif]-->
      <!--[if !mso]><!-->
      <a href="{{ button_url }}" target="_blank" class="mobile-button-link" style="display: inline-block; padding: 13px 28px; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 600; color: #FFFFFF; text-decoration: none; border-radius: 8px; background-color: #F7931E; line-height: 18px; text-align: center;">
        {{ button_text }}
      </a>
      <!--<![endif]-->
    </td>
  </tr>
</table>
