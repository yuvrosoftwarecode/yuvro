services:
  yuvro-code-executor:
    build:
      context: ./yuvro-code-executer
      dockerfile: Dockerfile
    ports:
      - "8009:8009"  # Code executor (host: 8009)
      - "9002:9002"  # Prometheus metrics
    env_file:
      - ./yuvro-code-executer/.env.local
      - path: ./yuvro-code-executer/.env.local-secrets
        required: false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8009/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: on-failure
    networks:
      - executor

networks:
  executor:
    external: true
