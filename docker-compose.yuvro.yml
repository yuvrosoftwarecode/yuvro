services:
  yuvro-code-executor:
    build:
      context: ./yuvro-code-executer
      dockerfile: Dockerfile
      args:
        - CACHEBUST=${CACHEBUST:-1}
    ports:
      - "8009:8009"  
      - "9002:9002" 
      - "8010:8010"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ./yuvro-code-executer/.env.local
      - path: ./yuvro-code-executer/.env.local-secrets
        required: false
    environment:
      - WORKSPACES_ROOT=/workspaces
      - YLABS_BACKEND_URL=http://ylabs-backend:8000  
    volumes:
      - ./workspaces:/workspaces
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8009/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: on-failure
    networks:
      - executor
      - ylabs  

  yuvro-minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data --console-address ":9101"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9100:9000"
      - "9101:9101"
    volumes:
      - yuvro_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: on-failure
    networks:
      - yuvro-storage

  yuvro-minio-init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    depends_on:
      yuvro-minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://yuvro-minio:9000 minioadmin minioadmin &&
      (mc mb --ignore-existing local/yuvro-local || true) &&
      mc anonymous set download local/yuvro-local || true
      "
    networks:
      - yuvro-storage
    restart: "no"

volumes:
  yuvro_minio_data:
networks:
  executor:
    external: true
  yuvro-storage:
  ylabs:
    external: true
    name: yuvro_ylabs
