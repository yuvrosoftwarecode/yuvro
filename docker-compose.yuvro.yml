services:
  yuvro-code-executor:
    build:
      context: ./yuvro-code-executer
      dockerfile: Dockerfile
    ports:
      - "8009:8009"  # Code executor (host: 8009)
      - "9002:9002"  # Prometheus metrics
    env_file:
      - ./yuvro-code-executer/.env.local
      - path: ./yuvro-code-executer/.env.local-secrets
        required: false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8009/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: on-failure
    networks:
      - executor

  # Shared MinIO — local S3-compatible object store.
  # Used by ycode + ycampus backends in DEPLOY_TYPE=local. Runs on its own
  # network; both backend composes attach to it as an external network.
  #   S3 API:      9100  (host) → 9000  (container)
  #   Web console: 9101  (host) → 9101  (container)
  # Buckets created on first boot by the yuvro-minio-init one-shot container.
  yuvro-minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data --console-address ":9101"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9100:9000"  # S3 API
      - "9101:9101"  # Web console
    volumes:
      - yuvro_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: on-failure
    networks:
      - yuvro-storage

  # One-shot init — creates the per-app buckets. Idempotent (ignore-existing).
  yuvro-minio-init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    depends_on:
      yuvro-minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://yuvro-minio:9000 minioadmin minioadmin &&
      (mc mb --ignore-existing local/ycode-uploads   || true) &&
      (mc mb --ignore-existing local/ycampus-uploads || true) &&
      mc anonymous set download local/ycode-uploads   || true &&
      mc anonymous set download local/ycampus-uploads || true
      "
    networks:
      - yuvro-storage
    restart: "no"

volumes:
  yuvro_minio_data:

networks:
  executor:
    external: true
  yuvro-storage:
