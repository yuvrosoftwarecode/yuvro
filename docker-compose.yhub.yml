services:
  yhub-db:
    image: postgres:15
    env_file:
      - path: ./yhub-backend-api/.env.local
        required: false
      - path: ./yhub-backend-api/.env.local-secrets
        required: false
    volumes:
      - yhub_postgres_data:/var/lib/postgresql/data
    ports:
      - "5435:5432"  # YHub PostgreSQL
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: on-failure
    networks:
      - yhub

  yhub-backend:
    build:
      context: ./yhub-backend-api
      dockerfile: Dockerfile
    ports:
      - "8003:8000"  # Django API (host: 8003)
      - "9004:9001"  # Prometheus metrics

    env_file:
      - path: ./yhub-backend-api/.env.local
        required: false
      - path: ./yhub-backend-api/.env.local-secrets
        required: false
    depends_on:
      yhub-db:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: on-failure
    networks:
      - yhub
      - executor
      - yuvro-storage


volumes:
  yhub_postgres_data:

networks:
  yhub:
    driver: bridge
  executor:
    external: true
