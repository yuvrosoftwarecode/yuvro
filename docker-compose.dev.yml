# Dev environment override - uses RDS instead of local DB containers
# Frontends and backends use the 'serve' build target (pre-built static assets, gunicorn)
# so the dev environment behaves like production for performance.
# Usage: docker compose -f docker-compose.yuvro.yml -f docker-compose.ycode.yml -f docker-compose.ycampus.yml -f docker-compose.dev.yml up -d

services:
  # Stub DB containers - stay healthy so depends_on is satisfied, but backends use RDS via .env.dev
  ycode-db:
    image: alpine
    command: ["sh", "-c", "while true; do sleep 3600; done"]
    healthcheck:
      test: ["CMD", "true"]
      interval: 1s
      timeout: 1s
      retries: 1
      start_period: 1s

  ycampus-db:
    image: alpine
    command: ["sh", "-c", "while true; do sleep 3600; done"]
    healthcheck:
      test: ["CMD", "true"]
      interval: 1s
      timeout: 1s
      retries: 1
      start_period: 1s

  # Use .env.dev files for all services
  yuvro-code-executor:
    env_file:
      - ./yuvro-code-executer/.env.dev
      - path: ./yuvro-code-executer/.env.dev-secrets
        required: false

  # Backend: use production target (gunicorn, not runserver)
  ycode-backend:
    build:
      context: ./ycode-backend-api
      dockerfile: Dockerfile
      target: production
    env_file:
      - ./ycode-backend-api/.env.dev
      - path: ./ycode-backend-api/.env.dev-secrets
        required: false
    command: >
      sh -c "python manage.py migrate &&
             gunicorn --bind 0.0.0.0:8000 --workers 3 --timeout 120 yc-backend-api.wsgi:application"

  # Frontend: use 'serve' target (pre-built static files served by nginx)
  ycode-frontend:
    build:
      context: ./ycode-web
      dockerfile: Dockerfile
      target: serve
      args:
        - VITE_BACKEND_API_BASE_URL=${YCODE_VITE_BACKEND_API_BASE_URL:-https://backend-code-dev.yuvro.ai/api}
        - VITE_CODE_EXECUTOR_BASE_URL=${YCODE_VITE_CODE_EXECUTOR_BASE_URL:-https://code-executer-dev.yuvro.ai}
        - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID:-}
    env_file:
      - ./ycode-web/.env.dev
      - path: ./ycode-web/.env.dev-secrets
        required: false
    # nginx serves on port 80 inside container; host port 3000 maps to it
    ports:
      - "3000:80"
    stdin_open: false
    tty: false
    command: ["nginx", "-g", "daemon off;"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 10s

  # Backend: use production target (gunicorn, not runserver)
  ycampus-backend:
    build:
      context: ./ycampus-backend-api
      dockerfile: Dockerfile
      target: production
    env_file:
      - ./ycampus-backend-api/.env.dev
      - path: ./ycampus-backend-api/.env.dev-secrets
        required: false
    command: >
      sh -c "python manage.py migrate &&
             gunicorn --bind 0.0.0.0:8000 --workers 3 --timeout 120 yc-backend-api.wsgi:application"

  # Frontend: use 'serve' target (pre-built static files served by nginx)
  ycampus-frontend:
    build:
      context: ./ycampus-web
      dockerfile: Dockerfile
      target: serve
      args:
        - VITE_BACKEND_API_BASE_URL=${YCAMPUS_VITE_BACKEND_API_BASE_URL:-https://backend-campus-dev.yuvro.ai/api}
        - VITE_CODE_EXECUTOR_BASE_URL=${YCAMPUS_VITE_CODE_EXECUTOR_BASE_URL:-https://code-executer-dev.yuvro.ai}
        - VITE_GOOGLE_CLIENT_ID=${YCAMPUS_VITE_GOOGLE_CLIENT_ID:-}
    env_file:
      - ./ycampus-web/.env.dev
      - path: ./ycampus-web/.env.dev-secrets
        required: false
    # nginx serves on port 80 inside container; host port 3001 maps to it
    ports:
      - "3001:80"
    stdin_open: false
    tty: false
    command: ["nginx", "-g", "daemon off;"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 10s

  # Stub DB for ylabs (uses RDS in dev)
  ylabs-db:
    image: alpine
    command: ["sh", "-c", "while true; do sleep 3600; done"]
    healthcheck:
      test: ["CMD", "true"]
      interval: 1s
      timeout: 1s
      retries: 1
      start_period: 1s

  # Backend: use production target (gunicorn)
  ylabs-backend:
    build:
      context: ./ylabs-backend-api
      dockerfile: Dockerfile
      target: production
    env_file:
      - ./ylabs-backend-api/.env.dev
      - path: ./ylabs-backend-api/.env.dev-secrets
        required: false
    command: >
      sh -c "python manage.py migrate &&
             gunicorn --bind 0.0.0.0:8000 --workers 3 --timeout 120 ylabs-backend-api.wsgi:application"

  # Frontend: SSR server (TanStack Start)
  ylabs-frontend:
    build:
      context: ./ylabs-web
      dockerfile: Dockerfile
      target: serve
      args:
        - VITE_BACKEND_API_BASE_URL=${YLABS_VITE_BACKEND_API_BASE_URL:-https://backend-labs-dev.yuvro.ai/api}
        - VITE_GOOGLE_CLIENT_ID=${YLABS_VITE_GOOGLE_CLIENT_ID:-}
    env_file:
      - ./ylabs-web/.env.dev
      - path: ./ylabs-web/.env.dev-secrets
        required: false
    ports:
      - "3002:3000"
    stdin_open: false
    tty: false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

# Override executor network - create it locally (not external)
networks:
  executor:
    driver: bridge
    external: false
