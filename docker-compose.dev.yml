# Dev environment override
# - All backends use RDS (ycode, ycampus) or containerised postgres where RDS
#   isn't provisioned yet (yhub, ylabs use their own postgres containers on dev).
# - All *-db containers are excluded via profiles so they don't auto-start.
# - Frontends use the 'serve' nginx target; ylabs uses 'development' (SSR).

services:

  # ── Disable local DB containers — dev uses RDS or external postgres ─────────
  ycode-db:
    profiles: ["local-only"]
  ycampus-db:
    profiles: ["local-only"]
  yhub-db:
    profiles: ["local-only"]
  ylabs-db:
    profiles: ["local-only"]

  # ── Code executor ─────────────────────────────────────────────────────────
  yuvro-code-executor:
    env_file:
      - ./yuvro-code-executer/.env.dev
      - path: ./yuvro-code-executer/.env.dev-secrets
        required: false

  # ── YCode backend (gunicorn + RDS) ────────────────────────────────────────
  ycode-backend:
    build:
      context: ./ycode-backend-api
      dockerfile: Dockerfile
      target: production
      args:
        - CACHEBUST=${CACHEBUST:-1}
    env_file:
      - ./ycode-backend-api/.env.dev
      - path: ./ycode-backend-api/.env.dev-secrets
        required: false
    command: >
      sh -c "python manage.py migrate &&
             gunicorn --bind 0.0.0.0:8000 --workers 3 --timeout 120 yc-backend-api.wsgi:application"

  # ── YCode frontend (nginx static) ─────────────────────────────────────────
  ycode-frontend:
    build:
      context: ./ycode-web
      dockerfile: Dockerfile
      target: serve
      args:
        - VITE_BACKEND_API_BASE_URL=${YCODE_VITE_BACKEND_API_BASE_URL:-https://backend-code-dev.yuvro.ai/api}
        - VITE_CODE_EXECUTOR_BASE_URL=${YCODE_VITE_CODE_EXECUTOR_BASE_URL:-https://code-executer-dev.yuvro.ai}
        - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID:-}
        - VITE_DEPLOY_COMMIT_SHA=${VITE_DEPLOY_COMMIT_SHA:-}
        - VITE_DEPLOY_BRANCH=${VITE_DEPLOY_BRANCH:-}
        - VITE_DEPLOY_APP_VERSION=${VITE_DEPLOY_APP_VERSION:-}
        - CACHEBUST=${CACHEBUST:-1}
    env_file:
      - ./ycode-web/.env.dev
      - path: ./ycode-web/.env.dev-secrets
        required: false
    ports:
      - "3000:80"
    stdin_open: false
    tty: false
    command: ["nginx", "-g", "daemon off;"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 10s

  # ── YCampus backend (gunicorn + RDS) ──────────────────────────────────────
  ycampus-backend:
    build:
      context: ./ycampus-backend-api
      dockerfile: Dockerfile
      target: production
      args:
        - CACHEBUST=${CACHEBUST:-1}
    env_file:
      - ./ycampus-backend-api/.env.dev
      - path: ./ycampus-backend-api/.env.dev-secrets
        required: false
    command: >
      sh -c "python manage.py migrate &&
             gunicorn --bind 0.0.0.0:8000 --workers 3 --timeout 120 yc-backend-api.wsgi:application"

  # ── YCampus frontend (nginx static) ───────────────────────────────────────
  ycampus-frontend:
    build:
      context: ./ycampus-web
      dockerfile: Dockerfile
      target: serve
      args:
        - VITE_BACKEND_API_BASE_URL=${YCAMPUS_VITE_BACKEND_API_BASE_URL:-https://backend-campus-dev.yuvro.ai/api}
        - VITE_CODE_EXECUTOR_BASE_URL=${YCAMPUS_VITE_CODE_EXECUTOR_BASE_URL:-https://code-executer-dev.yuvro.ai}
        - VITE_GOOGLE_CLIENT_ID=${YCAMPUS_VITE_GOOGLE_CLIENT_ID:-}
        - VITE_DEPLOY_COMMIT_SHA=${VITE_DEPLOY_COMMIT_SHA:-}
        - VITE_DEPLOY_BRANCH=${VITE_DEPLOY_BRANCH:-}
        - VITE_DEPLOY_APP_VERSION=${VITE_DEPLOY_APP_VERSION:-}
        - CACHEBUST=${CACHEBUST:-1}
    env_file:
      - ./ycampus-web/.env.dev
      - path: ./ycampus-web/.env.dev-secrets
        required: false
    ports:
      - "3001:80"
    stdin_open: false
    tty: false
    command: ["nginx", "-g", "daemon off;"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 10s

  # ── YLabs backend (gunicorn + RDS) ────────────────────────────────────────
  ylabs-backend:
    build:
      context: ./ylabs-backend-api
      dockerfile: Dockerfile
      target: production
      args:
        - CACHEBUST=${CACHEBUST:-1}
    env_file:
      - ./ylabs-backend-api/.env.dev
      - path: ./ylabs-backend-api/.env.dev-secrets
        required: false
    depends_on: []
    command: >
      sh -c "python manage.py migrate &&
             gunicorn --bind 0.0.0.0:8000 --workers 3 --timeout 120 ylabs-backend-api.wsgi:application"

  # ── YLabs frontend (dev server — TanStack Start SSR) ──────────────────────
  ylabs-frontend:
    build:
      context: ./ylabs-web
      dockerfile: Dockerfile
      target: development
      args:
        - VITE_BACKEND_API_BASE_URL=${YLABS_VITE_BACKEND_API_BASE_URL:-https://backend-dev.yuvrolabs.com/api}
        - VITE_YHUB_BACKEND_API_BASE_URL=${YLABS_VITE_YHUB_BACKEND_API_BASE_URL:-https://backend-hub-dev.yuvro.ai/api}
        - VITE_YCODE_BACKEND_API_BASE_URL=${YLABS_VITE_YCODE_BACKEND_API_BASE_URL:-https://backend-code-dev.yuvro.ai/api}
        - VITE_CODE_EXECUTOR_BASE_URL=${YLABS_VITE_CODE_EXECUTOR_BASE_URL:-https://code-executer-dev.yuvro.ai}
        - VITE_GOOGLE_CLIENT_ID=${YLABS_VITE_GOOGLE_CLIENT_ID:-}
        - CACHEBUST=${CACHEBUST:-1}
    env_file:
      - ./ylabs-web/.env.dev
      - path: ./ylabs-web/.env.dev-secrets
        required: false
    ports:
      - "3002:3000"
    stdin_open: true
    tty: true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── YHub backend (gunicorn + RDS) ─────────────────────────────────────────
  yhub-backend:
    build:
      context: ./yhub-backend-api
      dockerfile: Dockerfile
      target: production
    env_file:
      - ./yhub-backend-api/.env.dev
      - path: ./yhub-backend-api/.env.dev-secrets
        required: false
    depends_on: []
    command: >
      sh -c "python manage.py migrate &&
             gunicorn --bind 0.0.0.0:8000 --workers 3 --timeout 120 yhub-backend-api.wsgi:application"

# Override executor network - create it locally (not external)
networks:
  executor:
    driver: bridge
    external: false
