# Dev environment override - uses RDS instead of local DB containers
# Usage: docker compose -f docker-compose.common.yml -f docker-compose.yml -f docker-compose.ycampus.yml -f docker-compose.dev.yml up -d

services:
  # Stub DB containers - stay healthy so depends_on is satisfied, but backends use RDS via .env
  ycode-db:
    image: alpine
    command: ["sh", "-c", "while true; do sleep 3600; done"]
    healthcheck:
      test: ["CMD", "true"]
      interval: 1s
      timeout: 1s
      retries: 1
      start_period: 1s

  ycampus-db:
    image: alpine
    command: ["sh", "-c", "while true; do sleep 3600; done"]
    healthcheck:
      test: ["CMD", "true"]
      interval: 1s
      timeout: 1s
      retries: 1
      start_period: 1s

# Override executor network to be local (not external) so all services share it
networks:
  executor:
    driver: bridge
    external: false
