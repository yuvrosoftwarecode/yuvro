services:
  ycampus-db:
    image: postgres:15
    env_file:
      - ./ycampus-backend-api/.env
    volumes:
      - ycampus_postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ycampus

  ycampus-backend:
    build:
      context: ./ycampus-backend-api
      dockerfile: Dockerfile
    ports:
      - "8001:8000"  # Django API
      - "9001:9001"  # Prometheus metrics
    env_file:
      - ./ycampus-backend-api/.env
    volumes:
      - ./ycampus-backend-api:/app
    depends_on:
      ycampus-db:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - ycampus
      - executor  # Connect to executor network

  ycampus-frontend:
    build:
      context: ./ycampus-web
      dockerfile: Dockerfile
      target: development
    ports:
      - "3001:3000"
    env_file:
      - ./ycampus-web/.env
    volumes:
      - ./ycampus-web:/app
      - /app/node_modules
    stdin_open: true
    tty: true
    depends_on:
      - ycampus-backend
    command: npm run dev -- --host 0.0.0.0
    networks:
      - ycampus
      - executor  # Connect to executor network

volumes:
  ycampus_postgres_data:

networks:
  ycampus:
    driver: bridge
  executor:
    external: true
