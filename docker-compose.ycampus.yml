services:
  ycampus-db:
    image: postgres:15
    env_file:
      - ./ycampus-backend-api/.env.local
      - path: ./ycampus-backend-api/.env.local-secrets
        required: false
    volumes:
      - ycampus_postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"  # YCampus PostgreSQL (tech.md: 5433)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: on-failure
    networks:
      - ycampus

  ycampus-backend:
    build:
      context: ./ycampus-backend-api
      dockerfile: Dockerfile
    ports:
      - "8001:8000"  # Django API (host: 8001)
      - "9001:9001"  # Prometheus metrics
    env_file:
      - ./ycampus-backend-api/.env.local
      - path: ./ycampus-backend-api/.env.local-secrets
        required: false
    depends_on:
      ycampus-db:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: on-failure
    networks:
      - ycampus
      - executor
      - yuvro-storage

  ycampus-frontend:
    build:
      context: ./ycampus-web
      dockerfile: Dockerfile
      target: development
    env_file:
      - ./ycampus-web/.env.local
      - path: ./ycampus-web/.env.local-secrets
        required: false
    stdin_open: true
    tty: true
    depends_on:
      ycampus-backend:
        condition: service_started
    command: npm run dev -- --host 0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: on-failure
    networks:
      - ycampus
      - executor

volumes:
  ycampus_postgres_data:

networks:
  ycampus:
    driver: bridge
  executor:
    external: true
