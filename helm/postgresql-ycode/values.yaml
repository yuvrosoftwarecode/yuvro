# Default values for postgresql-ycode
namespace: ycode
replicaCount: 1

image: postgres
imageTag: "15"
imagePullPolicy: IfNotPresent
imagePullSecrets: []

database:
  name: ycode_backend_db
  user: postgres
  password: "change-this-password-in-production"

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 1Gi

livenessProbe:
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

persistence:
  enabled: true
  existingClaim: ""
  storageClass: standard
  size: 5Gi

nodeSelector: {}
affinity: {}
tolerations: []