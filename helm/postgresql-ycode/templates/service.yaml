apiVersion: v1
kind: Service
metadata:
  name: {{ include "postgresql-ycode.fullname" . }}
  namespace: {{ .Values.namespace | default "ycode" }}
  labels:
    {{- include "postgresql-ycode.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: postgresql
      protocol: TCP
      name: postgresql
  selector:
    {{- include "postgresql-ycode.selectorLabels" . | nindent 4 }}