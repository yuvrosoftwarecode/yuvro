apiVersion: v1
kind: Secret
metadata:
  name: {{ include "code-executor.fullname" . }}-secrets
  namespace: {{ .Values.namespace | default "yuvro" }}
  labels:
    {{- include "code-executor.labels" . | nindent 4 }}
type: Opaque
stringData:
  SECRET_KEY: {{ .Values.secrets.secretKey | required "secretKey is required" }}