# Production environment values
global:
  deployEnv: prod
  deployType: kubernetes
  imageRegistry: 123456789012.dkr.ecr.us-east-1.amazonaws.com
  storageClass: gp3

ycode-backend:
  replicaCount: 3
  image: ycode-backend
  imageTag: prod
  service:
    port: 8000
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi
  hpa:
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  ingress:
    enabled: true
    className: nginx
    hosts:
      - host: api.ycode.example.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: ycode-backend-tls-prod
        hosts:
          - api.ycode.example.com
  persistence:
    enabled: false

ycampus-backend:
  replicaCount: 3
  image: ycampus-backend
  imageTag: prod
  service:
    port: 8000
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi
  hpa:
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  ingress:
    enabled: true
    className: nginx
    hosts:
      - host: api.ycampus.example.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: ycampus-backend-tls-prod
        hosts:
          - api.ycampus.example.com
  persistence:
    enabled: false

ycode-frontend:
  replicaCount: 3
  image: ycode-frontend
  imageTag: prod
  service:
    port: 3000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  ingress:
    enabled: true
    className: nginx
    hosts:
      - host: www.ycode.example.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: ycode-frontend-tls-prod
        hosts:
          - www.ycode.example.com

ycampus-frontend:
  replicaCount: 3
  image: ycampus-frontend
  imageTag: prod
  service:
    port: 3002
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  ingress:
    enabled: true
    className: nginx
    hosts:
      - host: www.ycampus.example.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: ycampus-frontend-tls-prod
        hosts:
          - www.ycampus.example.com

code-executor:
  replicaCount: 3
  image: code-executor
  imageTag: prod
  service:
    port: 8009
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 4000m
      memory: 4Gi
  hpa:
    minReplicas: 3
    maxReplicas: 20
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  ingress:
    enabled: false

postgresql-ycode:
  enabled: false
  existingManaged: true
  host: ycode-prod-db.example.us-east-1.rds.amazonaws.com
  port: 5432
  database: ycode_backend_db
  sslMode: require

postgresql-ycampus:
  enabled: false
  existingManaged: true
  host: ycampus-prod-db.example.us-east-1.rds.amazonaws.com
  port: 5432
  database: ycampus_backend_db
  sslMode: require