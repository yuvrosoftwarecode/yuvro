# Code Executor Service
codeExecutor:
  enabled: true
  replicaCount: 1
  
  image: yuvro/code-executor:latest
  port: 8009
  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "1000m"
  
  env:
    DEBUG: "false"
    DEPLOY_ENV: production

# Ingress Configuration
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rate-limit: "100"
  
  tls:
    enabled: true
    issuer: letsencrypt-prod
  
  hosts:
    - host: code.yuvro.ai
      paths:
        - path: /
          pathType: Prefix
          backend: ycode-frontend
    
    - host: backend-code.yuvro.ai
      paths:
        - path: /api
          pathType: Prefix
          backend: ycode-backend
    
    - host: campus.yuvro.ai
      paths:
        - path: /
          pathType: Prefix
          backend: ycampus-frontend
    
    - host: backend-campus.yuvro.ai
      paths:
        - path: /api
          pathType: Prefix
          backend: ycampus-backend
    
    - host: labs.yuvro.ai
      paths:
        - path: /
          pathType: Prefix
          backend: ylabs-frontend
    
    - host: backend-labs.yuvro.ai
      paths:
        - path: /api
          pathType: Prefix
          backend: ylabs-backend
    
    - host: backend-hub.yuvro.ai
      paths:
        - path: /api
          pathType: Prefix
          backend: yhub-backend
    
    - host: marketplace.yuvro.ai
      paths:
        - path: /
          pathType: Prefix
          backend: ymarketplace-frontend
    
    - host: backend-marketplace.yuvro.ai
      paths:
        - path: /api
          pathType: Prefix
          backend: ymarketplace-backend
    
    - host: code-executor.yuvro.ai
      paths:
        - path: /
          pathType: Prefix
          backend: code-executor

# Service Configuration
service:
  type: LoadBalancer
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"

# Pod Disruption Budget
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Auto Scaling
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# Node Affinity
nodeAffinity:
  requiredDuringSchedulingIgnoredDuringExecution:
    nodeSelectorTerms:
      - matchExpressions:
          - key: kubernetes.io/os
            operator: In
            values:
              - linux
          - key: node.kubernetes.io/instance-type
            operator: In
            values:
              - t3.medium
              - t3.large
              - t3.xlarge
