# Yuvro Production Kubernetes Values
# Single consolidated RDS instance: prod-yuvro-db

global:
  environment: production
  namespace: yuvro-production
  apiEndpoint: "https"  # Protocol: https or http
  
  # Consolidated RDS Database
  database:
    host: prod-yuvro-db.ctie88aqw5oa.ap-south-1.rds.amazonaws.com
    port: 5432
    masterUser: yuvro_admin
    # Password should be provided via secrets
    sslMode: require
    
  # AWS Configuration
  aws:
    region: ap-south-1
    account: "123456789012"  # Replace with actual account ID
    
  # Image registry
  imageRegistry: docker.io
  imagePullPolicy: IfNotPresent

# YCode Application (Learning Platform)
ycode:
  enabled: true
  replicaCount: 2
  
  backend:
    image: yuvro/ycode-backend:latest
    port: 8000
    resources:
      requests:
        memory: "512Mi"
        cpu: "250m"
      limits:
        memory: "1Gi"
        cpu: "500m"
    
    env:
      DEBUG: "false"
      DEPLOY_ENV: production
      APP_NAME: yuvro-ycode
      DATABASE_NAME: ycode
      
  frontend:
    image: yuvro/ycode-frontend:latest
    port: 3000
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"
        cpu: "250m"
    
    env:
      DEBUG: "false"
      DEPLOY_ENV: production
      APP_NAME: yuvro-ycode

