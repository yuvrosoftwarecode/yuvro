{{- $backends := list "ycode" "ycampus" "ylabs" "yhub" "ymarketplace" "code-executor" }}
{{- range $app := $backends }}
{{- if eq $app "code-executor" }}
{{- if $.Values.codeExecutor.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: code-executor
  namespace: {{ $.Values.global.namespace }}
  labels:
    {{- include "yuvro-production.labels" $ | nindent 4 }}
    app: code-executor
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: code-executor
{{- end }}
{{- else if index $.Values $app "enabled" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $app }}-backend
  namespace: {{ $.Values.global.namespace }}
  labels:
    {{- include "yuvro-production.labels" $ | nindent 4 }}
    app: {{ $app }}-backend
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: {{ $app }}-backend
{{- end }}
{{- end }}

