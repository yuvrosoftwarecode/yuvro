{{- $backends := list "ycode" "ycampus" "ylabs" "yhub" "ymarketplace" "code-executor" }}
{{- range $app := $backends }}
{{- if eq $app "code-executor" }}
{{- if $.Values.codeExecutor.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: code-executor
  namespace: {{ $.Values.global.namespace }}
  labels:
    {{- include "yuvro-production.labels" $ | nindent 4 }}
    app: code-executor
spec:
  replicas: {{ $.Values.codeExecutor.replicaCount }}
  selector:
    matchLabels:
      app: code-executor
  template:
    metadata:
      labels:
        app: code-executor
        {{- include "yuvro-production.selectorLabels" $ | nindent 8 }}
    spec:
      containers:
      - name: code-executor
        image: "{{ $.Values.imageRegistry }}/{{ $.Values.codeExecutor.image }}"
        imagePullPolicy: {{ $.Values.imagePullPolicy }}
        ports:
        - name: http
          containerPort: {{ $.Values.codeExecutor.port }}
          protocol: TCP
        env:
        - name: DEBUG
          value: "{{ $.Values.codeExecutor.env.DEBUG }}"
        - name: DEPLOY_ENV
          value: "{{ $.Values.codeExecutor.env.DEPLOY_ENV }}"
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          {{- toYaml $.Values.codeExecutor.resources | nindent 10 }}
{{- end }}
{{- else if index $.Values $app "enabled" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $app }}-backend
  namespace: {{ $.Values.global.namespace }}
  labels:
    {{- include "yuvro-production.labels" $ | nindent 4 }}
    app: {{ $app }}-backend
spec:
  replicas: {{ index $.Values $app "replicaCount" }}
  selector:
    matchLabels:
      app: {{ $app }}-backend
  template:
    metadata:
      labels:
        app: {{ $app }}-backend
        {{- include "yuvro-production.selectorLabels" $ | nindent 8 }}
    spec:
      containers:
      - name: {{ $app }}-backend
        image: "{{ $.Values.imageRegistry }}/{{ index $.Values $app "backend" "image" }}"
        imagePullPolicy: {{ $.Values.imagePullPolicy }}
        ports:
        - name: http
          containerPort: {{ index $.Values $app "backend" "port" }}
          protocol: TCP
        env:
        {{- include "yuvro-production.dbEnv" $ | nindent 8 }}
        - name: DEBUG
          value: "{{ index $.Values $app "backend" "env" "DEBUG" }}"
        - name: DEPLOY_ENV
          value: "{{ index $.Values $app "backend" "env" "DEPLOY_ENV" }}"
        - name: APP_NAME
          value: "{{ index $.Values $app "backend" "env" "APP_NAME" }}"
        - name: DATABASE_NAME
          value: "{{ index $.Values $app "backend" "env" "DATABASE_NAME" }}"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: yuvro-db-credentials
              key: {{ $app }}-db-url
        livenessProbe:
          httpGet:
            path: /api/health/
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/health/
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          {{- toYaml (index $.Values $app "backend" "resources") | nindent 10 }}
{{- end }}
{{- end }}
