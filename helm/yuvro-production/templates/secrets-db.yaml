apiVersion: v1
kind: Secret
metadata:
  name: yuvro-db-credentials
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "yuvro-production.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.global.database.masterUser }}
  password: {{ .Values.global.database.masterPassword | quote }}
  # Database URLs for each app
  ycode-db-url: "postgresql://{{ .Values.global.database.masterUser }}:{{ .Values.global.database.masterPassword }}@{{ .Values.global.database.host }}:{{ .Values.global.database.port }}/ycode"
  ycampus-db-url: "postgresql://{{ .Values.global.database.masterUser }}:{{ .Values.global.database.masterPassword }}@{{ .Values.global.database.host }}:{{ .Values.global.database.port }}/ycampus"
  ylabs-db-url: "postgresql://{{ .Values.global.database.masterUser }}:{{ .Values.global.database.masterPassword }}@{{ .Values.global.database.host }}:{{ .Values.global.database.port }}/ylabs"
  yhub-db-url: "postgresql://{{ .Values.global.database.masterUser }}:{{ .Values.global.database.masterPassword }}@{{ .Values.global.database.host }}:{{ .Values.global.database.port }}/yhub"
  ymarketplace-db-url: "postgresql://{{ .Values.global.database.masterUser }}:{{ .Values.global.database.masterPassword }}@{{ .Values.global.database.host }}:{{ .Values.global.database.port }}/ymarketplace"
