{{- $apps := list "ycode" "ycampus" "ylabs" "ymarketplace" }}
{{- range $app := $apps }}
{{- if index $.Values $app "enabled" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $app }}-frontend
  namespace: {{ $.Values.global.namespace }}
  labels:
    {{- include "yuvro-production.labels" $ | nindent 4 }}
    app: {{ $app }}-frontend
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: {{ $app }}-frontend
{{- end }}
{{- end }}
