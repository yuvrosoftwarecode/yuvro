{{- $apps := list "ycode" "ycampus" "ylabs" "ymarketplace" }}
{{- range $app := $apps }}
{{- if index $.Values $app "enabled" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $app }}-frontend
  namespace: {{ $.Values.global.namespace }}
  labels:
    {{- include "yuvro-production.labels" $ | nindent 4 }}
    app: {{ $app }}-frontend
spec:
  replicas: {{ index $.Values $app "replicaCount" }}
  selector:
    matchLabels:
      app: {{ $app }}-frontend
  template:
    metadata:
      labels:
        app: {{ $app }}-frontend
        {{- include "yuvro-production.selectorLabels" $ | nindent 8 }}
    spec:
      containers:
      - name: {{ $app }}-frontend
        image: "{{ $.Values.imageRegistry }}/{{ index $.Values $app "frontend" "image" }}"
        imagePullPolicy: {{ $.Values.imagePullPolicy }}
        ports:
        - name: http
          containerPort: {{ index $.Values $app "frontend" "port" }}
          protocol: TCP
        env:
        - name: DEBUG
          value: "{{ index $.Values $app "frontend" "env" "DEBUG" }}"
        - name: DEPLOY_ENV
          value: "{{ index $.Values $app "frontend" "env" "DEPLOY_ENV" }}"
        - name: APP_NAME
          value: "{{ index $.Values $app "frontend" "env" "APP_NAME" }}"
        {{- if eq $app "ymarketplace" }}
        - name: VITE_BACKEND_API_BASE_URL
          value: "{{ $.Values.global.apiEndpoint }}/backend-marketplace-dev.yuvro.ai/api"
        - name: VITE_YHUB_BACKEND_API_BASE_URL
          value: "{{ $.Values.global.apiEndpoint }}/backend-hub-dev.yuvro.ai/api"
        {{- else if eq $app "ylabs" }}
        - name: VITE_BACKEND_API_BASE_URL
          value: "{{ $.Values.global.apiEndpoint }}/backend-dev.yuvrolabs.com/api"
        {{- else }}
        - name: VITE_BACKEND_API_BASE_URL
          value: "{{ $.Values.global.apiEndpoint }}/backend-{{ $app }}-dev.yuvro.ai/api"
        {{- end }}
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          {{- toYaml (index $.Values $app "frontend" "resources") | nindent 10 }}
{{- end }}
{{- end }}
