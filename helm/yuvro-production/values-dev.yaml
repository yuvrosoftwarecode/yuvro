# Development Kubernetes Values
# For local development with kind, minikube, or single-node cluster
# Minimal resource requirements, simplified ingress

global:
  environment: development
  namespace: yuvro-dev
  apiEndpoint: "http"  # Use HTTP for dev
  
  # RDS Database - Shared with Docker Compose dev
  database:
    host: "${DATABASE_HOST}"  # Injected by Terraform
    port: 5432
    masterUser: yuvro_admin
    sslMode: allow
    
  # AWS Configuration
  aws:
    region: ap-south-1
    
  # Image registry
  imageRegistry: docker.io
  imagePullPolicy: Always  # Always pull latest in dev

# YCode Application
ycode:
  enabled: true
  replicaCount: 1  # Single replica for dev
  
  backend:
    image: yuvro/ycode-backend:latest
    port: 8000
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"
        cpu: "250m"
    
    env:
      DEBUG: "true"
      DEPLOY_ENV: dev
      APP_NAME: yuvro-ycode
      DATABASE_NAME: ycode
      
  frontend:
    image: yuvro/ycode-frontend:latest
    port: 3000
    resources:
      requests:
        memory: "128Mi"
        cpu: "50m"
      limits:
        memory: "256Mi"
        cpu: "100m"
    
    env:
      DEBUG: "true"
      DEPLOY_ENV: dev
      APP_NAME: yuvro-ycode

