# Code Executor Service
codeExecutor:
  enabled: true
  replicaCount: 1
  
  image: yuvro/code-executor:latest
  port: 8009
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"
  
  env:
    DEBUG: "true"
    DEPLOY_ENV: dev

# Ingress - Disabled for dev (use port-forward instead)
ingress:
  enabled: false

# Service - Use NodePort for dev
service:
  type: NodePort
  annotations: {}

# Pod Disruption Budget - Disabled for dev
podDisruptionBudget:
  enabled: false

# Auto Scaling - Disabled for dev
autoscaling:
  enabled: false

# Node Affinity - Relaxed for dev
nodeAffinity:
  requiredDuringSchedulingIgnoredDuringExecution: {}
