# Ingress Configuration - Production-grade
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
  
  tls:
    enabled: true
    issuer: letsencrypt-prod
  
  # Configure actual ingress hosts
  hosts: []  # Leave empty; configure via separate ingress resources

# Service Configuration - NLB for prod
service:
  type: LoadBalancer
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: "tcp"

# Pod Disruption Budget - Ensure availability
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Auto Scaling - Production scaling policies
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  # Advanced metrics
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 2
        periodSeconds: 30
      selectPolicy: Max

# Node Affinity - Prefer larger instance types in prod
nodeAffinity:
  requiredDuringSchedulingIgnoredDuringExecution:
    nodeSelectorTerms:
      - matchExpressions:
          - key: kubernetes.io/os
            operator: In
            values:
              - linux
          - key: node.kubernetes.io/instance-type
            operator: In
            values:
              - t3.large
              - t3.xlarge
              - t3.2xlarge

# Pod Security Policy
podSecurityPolicy:
  enabled: true

# Network Policies
networkPolicy:
  enabled: true
  # Allow ingress traffic only from ingress controller
  policyTypes:
    - Ingress
    - Egress

# Resource Quotas
resourceQuota:
  enabled: true
  hard:
    requests.cpu: "20"
    requests.memory: "50Gi"
    limits.cpu: "40"
    limits.memory: "100Gi"

# Monitoring and logging
monitoring:
  enabled: true
  serviceMonitor: true
  dashboards: true
