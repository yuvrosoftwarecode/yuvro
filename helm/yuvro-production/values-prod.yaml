# Production Kubernetes Values
# High-availability, autoscaling, security-first configuration

global:
  environment: production
  namespace: yuvro-production
  apiEndpoint: "https"  # HTTPS only in production
  
  # RDS Database - Consolidated multi-database instance
  database:
    host: "${DATABASE_HOST}"  # Injected by Terraform
    port: 5432
    masterUser: yuvro_admin
    sslMode: require
    
  # AWS Configuration
  aws:
    region: ap-south-1
    
  # Image registry - Use specific versions in prod
  imageRegistry: docker.io
  imagePullPolicy: IfNotPresent

# YCode Application (Learning Platform)
ycode:
  enabled: true
  replicaCount: 2  # Minimum 2 for HA
  
  backend:
    image: yuvro/ycode-backend:latest
    port: 8000
    resources:
      requests:
        memory: "512Mi"
        cpu: "250m"
      limits:
        memory: "1Gi"
        cpu: "500m"
    
    # Liveness and readiness probes
    livenessProbe:
      httpGet:
        path: /api/health/
        port: 8000
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    
    readinessProbe:
      httpGet:
        path: /api/health/
        port: 8000
      initialDelaySeconds: 10
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3
    
    env:
      DEBUG: "false"
      DEPLOY_ENV: production
      APP_NAME: yuvro-ycode
      DATABASE_NAME: ycode
      LOG_LEVEL: info
      
  frontend:
    image: yuvro/ycode-frontend:latest
    port: 3000
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"
        cpu: "250m"
    
    env:
      DEBUG: "false"
      DEPLOY_ENV: production
      APP_NAME: yuvro-ycode
      NODE_ENV: production

