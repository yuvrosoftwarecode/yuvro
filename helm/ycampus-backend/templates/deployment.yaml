apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ycampus-backend.fullname" . }}
  namespace: {{ .Values.namespace | default "ycampus" }}
  labels:
    {{- include "ycampus-backend.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "ycampus-backend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ycampus-backend.selectorLabels" . | nindent 8 }}
    spec:
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ if .Values.global.imageRegistry }}{{ .Values.global.imageRegistry }}/{{ end }}{{ .Values.image }}:{{ .Values.imageTag | default .Chart.Version }}
          imagePullPolicy: {{ .Values.imagePullPolicy | default "IfNotPresent" }}
          ports:
            - containerPort: {{ .Values.service.port }}
              name: http
            - containerPort: 9001
              name: metrics
          env:
            - name: DEPLOY_ENV
              value: {{ .Values.global.deployEnv | quote }}
            - name: DEPLOY_TYPE
              value: {{ .Values.global.deployType | quote }}
            - name: DEBUG
              value: {{ .Values.debug | default "False" | quote }}
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "ycampus-backend.fullname" . }}-secrets
                  key: SECRET_KEY
            - name: ALLOWED_HOSTS
              value: {{ .Values.allowedHosts | default "*" | quote }}
            - name: CORS_ALLOWED_ORIGINS
              value: {{ .Values.corsOrigins | default "http://localhost:3002" | quote }}
            - name: DATABASE_HOST
              value: {{ include "ycampus-backend.databaseHost" . | quote }}
            - name: DATABASE_NAME
              value: {{ .Values.database.name | default "ycampus_backend_db" | quote }}
            - name: DATABASE_PORT
              value: {{ .Values.database.port | default "5432" | toString | quote }}
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "ycampus-backend.fullname" . }}-secrets
                  key: DATABASE_USER
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "ycampus-backend.fullname" . }}-secrets
                  key: DATABASE_PASSWORD
            - name: JWT_ACCESS_TOKEN_LIFETIME
              value: {{ .Values.jwt.accessTokenLifetime | default "15" | toString | quote }}
            - name: JWT_REFRESH_TOKEN_LIFETIME
              value: {{ .Values.jwt.refreshTokenLifetime | default "7" | toString | quote }}
            - name: CODE_EXECUTOR_URL
              value: {{ include "ycampus-backend.codeExecutorUrl" . | quote }}
            - name: EMAIL_HOST_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "ycampus-backend.fullname" . }}-secrets
                  key: EMAIL_HOST_USER
            - name: EMAIL_HOST_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "ycampus-backend.fullname" . }}-secrets
                  key: EMAIL_HOST_PASSWORD
            - name: DEFAULT_FROM_EMAIL
              valueFrom:
                secretKeyRef:
                  name: {{ include "ycampus-backend.fullname" . }}-secrets
                  key: DEFAULT_FROM_EMAIL
            {{- if .Values.extraEnv }}
            {{- toYaml .Values.extraEnv | nindent 12 }}
            {{- end }}
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
            limits:
              cpu: {{ .Values.resources.limits.cpu }}
              memory: {{ .Values.resources.limits.memory }}
          livenessProbe:
            httpGet:
              path: /api/health/
              port: {{ .Values.service.port }}
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds | default 60 }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds | default 30 }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds | default 10 }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold | default 3 }}
          readinessProbe:
            httpGet:
              path: /api/health/
              port: {{ .Values.service.port }}
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds | default 30 }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds | default 10 }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds | default 5 }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold | default 3 }}
          startupProbe:
            httpGet:
              path: /api/health/
              port: {{ .Values.service.port }}
            initialDelaySeconds: {{ .Values.startupProbe.initialDelaySeconds | default 10 }}
            periodSeconds: {{ .Values.startupProbe.periodSeconds | default 10 }}
            timeoutSeconds: {{ .Values.startupProbe.timeoutSeconds | default 5 }}
            failureThreshold: {{ .Values.startupProbe.failureThreshold | default 30 }}
      {{- if .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if .Values.affinity }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
      {{- end }}
      {{- if .Values.tolerations }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      {{- end }}