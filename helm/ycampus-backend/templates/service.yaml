apiVersion: v1
kind: Service
metadata:
  name: {{ include "ycampus-backend.fullname" . }}
  namespace: {{ .Values.namespace | default "ycampus" }}
  labels:
    {{- include "ycampus-backend.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type | default "ClusterIP" }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: 9001
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "ycampus-backend.selectorLabels" . | nindent 4 }}