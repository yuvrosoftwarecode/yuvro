apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ycampus-backend.fullname" . }}-secrets
  namespace: {{ .Values.namespace | default "ycampus" }}
  labels:
    {{- include "ycampus-backend.labels" . | nindent 4 }}
type: Opaque
stringData:
  SECRET_KEY: {{ .Values.secrets.secretKey | required "secretKey is required" }}
  DATABASE_USER: {{ .Values.secrets.databaseUser | default "postgres" }}
  DATABASE_PASSWORD: {{ .Values.secrets.databasePassword | required "databasePassword is required" }}
  GOOGLE_OAUTH2_CLIENT_ID: {{ .Values.secrets.googleOAuthClientId | default "" }}
  GOOGLE_OAUTH2_CLIENT_SECRET: {{ .Values.secrets.googleOAuthClientSecret | default "" }}
  EMAIL_HOST_USER: {{ .Values.secrets.emailHostUser | default "" }}
  EMAIL_HOST_PASSWORD: {{ .Values.secrets.emailHostPassword | default "" }}
  DEFAULT_FROM_EMAIL: {{ .Values.secrets.defaultFromEmail | default "" }}