apiVersion: v1
kind: Secret
metadata:
  name: {{ include "postgresql-ycampus.fullname" . }}-secrets
  namespace: {{ .Values.namespace | default "ycampus" }}
  labels:
    {{- include "postgresql-ycampus.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_USER: {{ .Values.database.user | default "postgres" }}
  DATABASE_PASSWORD: {{ .Values.database.password | required "database.password is required" }}