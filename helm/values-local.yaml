# Local Kubernetes Values (Docker Desktop K8s cluster)
# Minimal resource requirements, uses Docker Desktop's built-in K8s
# Used for: DEPLOY_INFRA_TYPE=eks with local Docker Desktop cluster

global:
  environment: local
  namespace: yuvro
  apiEndpoint: "http"  # HTTP for local
  
  # PostgreSQL (on host Docker Desktop or external)
  # For full local setup: run PostgreSQL in Docker Desktop separately
  database:
    host: host.docker.internal  # Docker Desktop host resolution
    port: 5432
    masterUser: postgres
    sslMode: disable
    
  # Local image registry (DockerHub for local Docker Desktop)
  imageRegistry: docker.io
  imagePullPolicy: IfNotPresent

# YCode Application
ycode:
  enabled: true
  replicaCount: 1
  
  backend:
    image: docker.io/library/yuvro-ycode-backend:latest
    port: 8000
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"
        cpu: "250m"
    
    env:
      DEBUG: "true"
      DEPLOY_ENV: local
      APP_NAME: yuvro-ycode
      DATABASE_NAME: ycode
      
  frontend:
    image: docker.io/library/yuvro-ycode-frontend:latest
    port: 3000
    resources:
      requests:
        memory: "128Mi"
        cpu: "50m"
      limits:
        memory: "256Mi"
        cpu: "200m"

# YCampus Application
ycampus:
  enabled: true
  replicaCount: 1
  
  backend:
    image: docker.io/library/yuvro-ycampus-backend:latest
    port: 8000
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"
        cpu: "250m"
    
    env:
      DEBUG: "true"
      DEPLOY_ENV: local
      APP_NAME: yuvro-ycampus
      DATABASE_NAME: ycampus
      
  frontend:
    image: docker.io/library/yuvro-ycampus-frontend:latest
    port: 3000
    resources:
      requests:
        memory: "128Mi"
        cpu: "50m"
      limits:
        memory: "256Mi"
        cpu: "200m"

# Code Executor
codeExecutor:
  enabled: true
  replicaCount: 1
  
  image: docker.io/library/yuvro-code-executor:latest
  port: 8009
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"

# MinIO (S3-compatible storage)
minio:
  enabled: true
  replicaCount: 1
  
  image: docker.io/minio/minio:latest
  port: 9000
  console_port: 9001
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "250m"

# Service configuration
services:
  type: ClusterIP  # Use ClusterIP for local (no LoadBalancer needed)
  
# Ingress (optional for local)
ingress:
  enabled: false  # Disable ingress for local testing

# Persistence (optional)
persistence:
  enabled: false  # Use emptyDir for local testing
