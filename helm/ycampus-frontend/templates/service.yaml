apiVersion: v1
kind: Service
metadata:
  name: {{ include "ycampus-frontend.fullname" . }}
  namespace: {{ .Values.namespace | default "ycampus" }}
  labels:
    {{- include "ycampus-frontend.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type | default "ClusterIP" }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "ycampus-frontend.selectorLabels" . | nindent 4 }}