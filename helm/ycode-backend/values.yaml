# Default values for ycode-backend
namespace: ycode
replicaCount: 1

global:
  deployEnv: local
  deployType: kubernetes
  imageRegistry: localhost:5000

image: ycode-backend
imageTag: latest
imagePullPolicy: IfNotPresent
imagePullSecrets: []

service:
  type: ClusterIP
  port: 8000

database:
  host: ""
  port: 5432
  name: ycode_backend_db

jwt:
  accessTokenLifetime: "15"
  refreshTokenLifetime: "7"

codeExecutor:
  service:
    port: 8009

debug: "False"
allowedHosts: "*"
corsOrigins: "http://localhost:3000"

secrets:
  secretKey: "change-this-secret-key-in-production"
  databaseUser: "postgres"
  databasePassword: "change-this-password-in-production"
  googleOAuthClientId: ""
  googleOAuthClientSecret: ""
  openaiApiKey: ""
  anthropicApiKey: ""
  geminiApiKey: ""
  cohereApiKey: ""
  huggingfaceApiKey: ""
  emailHostUser: ""
  emailHostPassword: ""
  defaultFromEmail: ""

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

livenessProbe:
  initialDelaySeconds: 60
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 3

readinessProbe:
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

startupProbe:
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 30

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

hpa:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

postgresql:
  enabled: true
  existingManaged: false
  host: ""
  sslMode: ""

nodeSelector: {}
affinity: {}
tolerations: []

extraEnv: []