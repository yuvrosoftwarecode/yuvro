services:

  yhub-backend:
    image: ghcr.io/yuvro/yhub-backend:${DEPLOY_BRANCH:-main}
    container_name: yuvro-yhub-backend-prod
    restart: always
    ports:
      - "8003:8000"
    environment:
      - DEPLOY_ENV=prod
      - DEPLOY_INFRA_TYPE=ec2
      - DEBUG=False
      - ALLOWED_HOSTS=*
      - CORS_ALLOWED_ORIGINS=*
    env_file:
      - ./yhub-backend-api/.env.prod
      - path: ./yhub-backend-api/.env.prod-secrets
        required: false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - yuvro-net

networks:
  yuvro-net:
    driver: bridge
