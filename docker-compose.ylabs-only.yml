services:
  ylabs-db:
    env_file:
      - ./ylabs-backend-api/.env.local
      - path: ./ylabs-backend-api/.env.local-secrets
        required: false

  ylabs-backend:
    env_file:
      - ./ylabs-backend-api/.env.local
      - path: ./ylabs-backend-api/.env.local-secrets
        required: false
    volumes:
      - ./ylabs-backend-api:/app
      - /app/venv

  ylabs-frontend:
    env_file:
      - ./ylabs-web/.env.local
      - path: ./ylabs-web/.env.local-secrets
        required: false
    ports:
      - "3002:3000"
    volumes:
      - ./ylabs-web:/app
      - /app/node_modules
