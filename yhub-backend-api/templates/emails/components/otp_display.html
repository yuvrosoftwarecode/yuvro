<!-- Dedicated OTP Display Container -->
<table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%" style="margin: 26px 0 20px 0;">
  <tr>
    <td align="center">
      <table role="presentation" border="0" cellpadding="0" cellspacing="0" style="margin: 0 auto;">
        <tr>
          <td align="center" style="background-color: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 10px; padding: 22px 36px;">
            <div class="otp-value" style="font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Courier, monospace; font-size: 34px; font-weight: 700; color: #0F172A; letter-spacing: 8px; line-height: 1.2; user-select: all; -webkit-user-select: all; white-space: nowrap;">
              {{ otp }}
            </div>
            <div style="margin-top: 10px;">
              <span style="display: inline-block; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 600; color: #9A3412; background-color: #FEF3C7; border: 1px solid #FDE68A; border-radius: 9999px; padding: 3px 10px; line-height: 14px; letter-spacing: 0.2px;">
                Valid for {{ expiry_minutes|default:"5" }} minutes
              </span>
            </div>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
