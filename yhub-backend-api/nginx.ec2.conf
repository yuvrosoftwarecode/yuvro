# YHub Backend (port 8003)
server {
    listen 80;
    server_name backend-hub-dev.yuvro.ai;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name backend-hub-dev.yuvro.ai;
    ssl_certificate /etc/letsencrypt/live/backend-hub-dev.yuvro.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/backend-hub-dev.yuvro.ai/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/backend-hub-dev.yuvro.ai/chain.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    client_max_body_size 50M;
    location / {
        proxy_pass http://localhost:8003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}