# docker-compose.dev-ymarketplace.yml
# Dev overrides for YMarketplace only.
# Used by deploy-ymarketplace.sh so it doesn't pull in unrelated services
# (e.g. yuvro-code-executor) from the shared docker-compose.dev.yml.
# Also removes the ymarketplace-db dependency since dev uses RDS.

services:
  ymarketplace-backend:
    build:
      context: ./ymarketplace/backend
      dockerfile: Dockerfile
      target: dev
      args:
        - CACHEBUST=${CACHEBUST:-1}
    env_file:
      - path: ./ymarketplace/backend/.env.dev
        required: false
      - path: ./ymarketplace/backend/.env.dev-secrets
        required: false
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn --bind 0.0.0.0:8004 --workers 3 --timeout 120 config.wsgi:application"
    # Remove local DB dependency — dev uses RDS
    depends_on: {}

  ymarketplace-frontend:
    build:
      context: ./ymarketplace/frontend
      dockerfile: Dockerfile
      target: dev
      args:
        - VITE_BACKEND_API_BASE_URL=${YMARKETPLACE_VITE_BACKEND_API_BASE_URL:-https://backend-marketplace-dev.yuvro.ai/api}
        - VITE_YHUB_BACKEND_API_BASE_URL=${YMARKETPLACE_VITE_YHUB_BACKEND_API_BASE_URL:-https://backend-hub-dev.yuvro.ai/api}
        - CACHEBUST=${CACHEBUST:-1}
    env_file:
      - path: ./ymarketplace/frontend/.env.dev
        required: false
      - path: ./ymarketplace/frontend/.env.dev-secrets
        required: false
    ports:
      - "3004:3004"
    stdin_open: false
    tty: false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3004/"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    # Only depend on backend, not the local DB container
    depends_on:
      ymarketplace-backend:
        condition: service_started
