services:
  ycampus-db:
    image: postgres:15
    env_file:
      - ./ycampus-backend-api/.env.prod
    volumes:
      - ycampus_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ycampus

  ycampus-backend:
    build:
      context: ./ycampus-backend-api
      dockerfile: Dockerfile
      target: production
    env_file:
      - ./ycampus-backend-api/.env.prod
    depends_on:
      ycampus-db:
        condition: service_healthy
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn --bind 0.0.0.0:8000 ycampus-backend-api.wsgi:application"
    networks:
      - ycampus
      - ycode  # Share code-executor from ycode network

  ycampus-frontend:
    build:
      context: ./ycampus-web
      dockerfile: Dockerfile
      target: production
      args:
        - BACKEND_API_BASE_URL=${YCAMPUS_BACKEND_API_BASE_URL}
    env_file:
      - ./ycampus-web/.env.prod
    ports:
      - "81:80"
    depends_on:
      - ycampus-backend
    restart: unless-stopped
    networks:
      - ycampus
      - ycode  # Share code-executor from ycode network

volumes:
  ycampus_postgres_data:

networks:
  ycampus:
    driver: bridge
  ycode:
    external: true
