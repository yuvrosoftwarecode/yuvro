<!-- Reusable Security Notice Component -->
<div style="margin: 22px 0 16px 0; border: 1px solid #FED7AA; border-left: 3px solid #F7931E; background-color: #FFFDF8; border-radius: 6px; padding: 13px 16px;">
  <p style="margin: 0 0 3px 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 700; color: #9A3412; text-transform: uppercase; letter-spacing: 0.5px;">
    {{ security_title|default:"Security Notice" }}
  </p>
  <p style="margin: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; line-height: 1.5; color: #7C2D12;">
    {{ security_message|default:"If you didn't initiate this request, you can safely ignore this email. Your account remains secure." }}
  </p>
</div>
