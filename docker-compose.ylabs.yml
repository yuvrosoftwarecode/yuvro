services:
  # ylabs-db: Disabled - using RDS for database
  # Uncomment below if using local PostgreSQL instead of RDS
  # ylabs-db:
  #   image: postgres:15
  #   env_file:
  #     - path: ./ylabs-backend-api/.env.local
  #       required: false
  #     - path: ./ylabs-backend-api/.env.local-secrets
  #       required: false
  #   volumes:
  #     - ylabs_postgres_data:/var/lib/postgresql/data
  #   ports:
  #     - "5434:5432"  # YLabs PostgreSQL
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U postgres"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #     start_period: 20s
  #   restart: on-failure
  #   networks:
  #     - ylabs

  ylabs-backend:
    build:
      context: ./ylabs-backend-api
      dockerfile: Dockerfile
      args:
        - CACHEBUST=${CACHEBUST:-1}
    ports:
      - "8002:8000"  # Django API (host: 8002)
      - "9003:9001"  # Prometheus metrics
    env_file:
      - path: ./ylabs-backend-api/.env.dev
        required: false
      - path: ./ylabs-backend-api/.env.dev-secrets
        required: false
    volumes:
      - ./ylabs-backend-api:/app
      - ./workspaces:/workspaces
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: on-failure
    networks:
      - ylabs
      - yuvro-storage

  ylabs-frontend:
    build:
      context: ./ylabs-web
      dockerfile: Dockerfile
      target: serve
      args:
        - CACHEBUST=${CACHEBUST:-1}
    env_file:
      - path: ./ylabs-web/.env.dev
        required: false
      - path: ./ylabs-web/.env.dev-secrets
        required: false
    ports:
      - "3002:3000"
    depends_on:
      ylabs-backend:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: on-failure
    networks:
      - ylabs

volumes: {}
  # ylabs_postgres_data: (removed - using RDS)

networks:
  ylabs:
    external: true
    name: yuvro_ylabs
  executor:
    external: true
  yuvro-storage:
