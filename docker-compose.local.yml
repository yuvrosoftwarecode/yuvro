# docker-compose.local.yml
# Override for DEPLOY_ENV=local: loads .env.local + .env.local-secrets and mounts source for live reload.
# Usage: docker compose -f docker-compose.yuvro.yml -f docker-compose.ycode.yml \
#          -f docker-compose.ycampus.yml -f docker-compose.local.yml up

services:


  # ── YLabs ──────────────────────────────────────────────────────────────────
  ylabs-db:
    env_file:
      - ./ylabs-backend-api/.env.local
      - path: ./ylabs-backend-api/.env.local-secrets
        required: false

  ylabs-backend:
    env_file:
      - ./ylabs-backend-api/.env.local
      - path: ./ylabs-backend-api/.env.local-secrets
        required: false
    volumes:
      - ./ylabs-backend-api:/app
      - /app/venv

  ylabs-frontend:
    env_file:
      - ./ylabs-web/.env.local
      - path: ./ylabs-web/.env.local-secrets
        required: false
    ports:
      - "3002:3000"
    volumes:
      - ./ylabs-web:/app
      - /app/node_modules

 # ── YHub ───────────────────────────────────────────────────────────────────
  yhub-db:
    env_file:
      - ./yhub-backend-api/.env.local
      - path: ./yhub-backend-api/.env.local-secrets
        required: false

  yhub-backend:
    env_file:
      - ./yhub-backend-api/.env.local
      - path: ./yhub-backend-api/.env.local-secrets
        required: false
    volumes:
      - ./yhub-backend-api:/app
      - /app/venv
    depends_on:
      yuvro-minio:
        condition: service_healthy
      yuvro-minio-init:
        condition: service_completed_successfully

  # ── Code Executor ──────────────────────────────────────────────────────────
  yuvro-code-executor:
    env_file:
      - ./yuvro-code-executer/.env.local
      - path: ./yuvro-code-executer/.env.local-secrets
        required: false
    volumes:
      - ./yuvro-code-executer:/app
