services:
  yuvro-jaeger:
    image: jaegertracing/all-in-one:1.52
    ports:
      - "16686:16686"
      - "14268:14268"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - ycode
      - ycampus
      - observability

  yuvro-otel-collector:
    image: otel/opentelemetry-collector-contrib:0.91.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./yuvro-observability/otel-collector-config.yaml:/etc/otel-collector-config.yaml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
      - "8889:8889"   # Prometheus metrics
    depends_on:
      - yuvro-jaeger
      - yuvro-prometheus
      - yuvro-loki
    networks:
      - ycode
      - ycampus
      - observability

  yuvro-prometheus:
    image: prom/prometheus:v2.48.1
    ports:
      - "9090:9090"
    volumes:
      - ./yuvro-observability/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - ycode
      - ycampus
      - observability

  yuvro-loki:
    image: grafana/loki:3.0.0
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./yuvro-observability/loki-config.yaml:/etc/loki/local-config.yaml
      - loki_data:/loki
    environment:
      - JAEGER_AGENT_HOST=yuvro-jaeger
      - JAEGER_ENDPOINT=http://yuvro-jaeger:14268/api/traces
      - JAEGER_SAMPLER_TYPE=const
      - JAEGER_SAMPLER_PARAM=1
    networks:
      - ycode
      - ycampus
      - observability

  yuvro-grafana:
    image: grafana/grafana:10.2.3
    ports:
      - "3003:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./yuvro-observability/grafana/provisioning:/etc/grafana/provisioning
      - ./yuvro-observability/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - yuvro-prometheus
      - yuvro-loki
    networks:
      - ycode
      - ycampus
      - observability

  # Extend YCode services with observability
  ycode-backend:
    env_file:
      - ./ycode-backend-api/.env
      - ./ycode-backend-api/.env.observability
    depends_on:
      - yuvro-otel-collector
    networks:
      - ycode
      - observability

  ycode-frontend:
    env_file:
      - ./ycode-web/.env
      - ./ycode-web/.env.observability
    networks:
      - ycode
      - observability

  # Extend YCampus services with observability
  ycampus-backend:
    env_file:
      - ./ycampus-backend-api/.env
      - ./ycampus-backend-api/.env.observability
    depends_on:
      - yuvro-otel-collector
    networks:
      - ycampus
      - observability

  ycampus-frontend:
    env_file:
      - ./ycampus-web/.env
      - ./ycampus-web/.env.observability
    networks:
      - ycampus
      - observability

  # Extend code executor with observability
  yuvro-code-executor:
    env_file:
      - ./ycode-executor-api/.env
      - ./ycode-executor-api/.env.observability
    depends_on:
      - yuvro-otel-collector
    networks:
      - executor
      - observability

volumes:
  prometheus_data:
  grafana_data:
  loki_data:

networks:
  ycode:
    external: true
  ycampus:
    external: true
  executor:
    external: true
  observability:
    driver: bridge
